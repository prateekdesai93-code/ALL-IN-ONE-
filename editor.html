  var NAV_ITEMS = [
    { key: "dashboard", label: "Dashboard", href: "index.html", icon: ICONS.dashboard },
    { key: "products", label: "Products", href: "products.html", icon: ICONS.products },
    { key: "production", label: "Production", href: "production.html", icon: ICONS.production },
    { key: "customers", label: "Customers", href: "customers.html", icon: ICONS.customers },
    { key: "invoices", label: "Invoices", href: "invoices.html", icon: ICONS.invoices },
    { key: "credit-notes", label: "Credit Notes", href: "credit-notes.html", icon: ICONS.creditNote },
    { key: "payments", label: "Payments", href: "payments.html", icon: ICONS.payments },
    { key: "reports", label: "Reports", href: "reports.html", icon: ICONS.reports },
    { key: "settings", label: "Settings", href: "settings.html", icon: ICONS.settings },
  ];

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function applyAccent() {
    var settings = MFG.getData().settings;
    document.documentElement.setAttribute("data-theme", settings.theme || "dark");
  }

  function qs(name) {
    try {
      return new URLSearchParams(window.location.search).get(name);
    } catch (e) {
      return null;
    }
  }

  function renderShell(activeKey) {
    applyAccent();
    var navHtml = NAV_ITEMS.map(function (item) {
      var isActive = item.key === activeKey;
      return (
        '<a class="nav-link' + (isActive ? " active" : "") + '" href="' + item.href + '">' +
        item.icon + "<span>" + item.label + "</span></a>"
      );
    }).join("");

    var shellHtml =
      '<div class="storage-banner hidden" id="storageBanner" role="alert">' +
        "⚠ Your browser couldn't save your last change — storage may be full or blocked. " +
        '<a href="settings.html">Export a backup now</a> before doing anything else.' +
      "</div>" +
      '<div class="mobile-topbar">' +
        '<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">' + ICONS.menu + "</button>" +
        '<strong style="font-size:14px;">Manufacturing &amp; Invoicing</strong>' +
      "</div>" +
      '<div class="app">' +
        '<div class="sidebar-backdrop" id="sidebarBackdrop"></div>' +
        '<aside class="sidebar" id="sidebar">' +
          '<div class="brand"><div class="brand-mark">M</div><div class="brand-text"><div class="brand-title">Manufacturing &amp; Invoicing</div><div class="brand-sub">Make it, stock it, sell it</div></div></div>' +
          '<nav class="nav">' + navHtml + "</nav>" +
          '<div class="sidebar-footer">Build ' + BUILD_DATE + " · Local data only</div>" +
        "</aside>" +
        '<div class="main">' +
          '<header class="topbar">' +
            '<div><h1 id="pageTitle"></h1><p class="sub" id="pageSub"></p></div>' +
            '<div class="topbar-actions" id="topbarActions"></div>' +
          "</header>" +
          '<div class="content" id="pageContent"></div>' +
        "</div>" +
      "</div>";

    var root = document.getElementById("app-shell");
    root.innerHTML = shellHtml;

    var menuBtn = document.getElementById("mobileMenuBtn");
    var backdrop = document.getElementById("sidebarBackdrop");
    function closeMenu() { document.body.classList.remove("sidebar-open"); }
    if (menuBtn) menuBtn.addEventListener("click", function () { document.body.classList.toggle("sidebar-open"); });
    if (backdrop) backdrop.addEventListener("click", closeMenu);
    document.querySelectorAll(".nav-link").forEach(function (a) { a.addEventListener("click", closeMenu); });

    // A prior write to localStorage may have already failed (e.g. this
    // navigation itself was the write that hit a full/blocked storage) —
    // rebuild the shell already knowing that, rather than waiting for the
    // next persist() to notice.
    if (MFG.isStorageDegraded()) showStorageBanner();

    return {
      contentEl: document.getElementById("pageContent"),
      setTitle: function (title, sub) {
        document.getElementById("pageTitle").textContent = title;
        document.getElementById("pageSub").textContent = sub || "";
      },
      setActions: function (html) {
        document.getElementById("topbarActions").innerHTML = html;
      },
    };
  }

  // ---------- storage-degraded banner ----------
  // Shown when a write to localStorage has failed (store.js's
  // safeSetItem calls showStorageBanner() from its catch block) so the
  // change silently only landed in the in-memory fallback and would be
  // lost on refresh/close. Sticky and hard to miss on purpose.
  function showStorageBanner() {
    var bannerEl = document.getElementById("storageBanner");
    if (bannerEl) bannerEl.classList.remove("hidden");
  }
  function hideStorageBanner() {
    var bannerEl = document.getElementById("storageBanner");
    if (bannerEl) bannerEl.classList.add("hidden");
  }

  // ---------- toast ----------
  function toast(message, tone) {
    var root = document.getElementById("toast-root");
    if (!root) return;
    var node = el('<div class="toast ' + (tone || "") + '">' + escapeHtml(message) + "</div>");
    root.appendChild(node);
    setTimeout(function () {
      node.style.transition = "opacity 0.25s ease";
      node.style.opacity = "0";
      setTimeout(function () { node.remove(); }, 250);
    }, 2600);
  }

  // ---------- modal ----------
  function openModal(opts) {
    var root = document.getElementById("modal-root");
    var backdrop = el(
      '<div class="modal-backdrop">' +
        '<div class="modal" role="dialog" aria-modal="true"' + (opts.wide ? ' style="max-width:640px;"' : "") + '>' +
          '<div class="modal-header"><h3>' + escapeHtml(opts.title) + '</h3><button class="btn-icon neutral" id="modalCloseBtn" aria-label="Close">' + ICONS.close + "</button></div>" +
          '<div class="modal-body" id="modalBody"></div>' +
          '<div class="modal-footer" id="modalFooter"></div>' +
        "</div>" +
      "</div>"
    );
    root.appendChild(backdrop);
    var bodyEl = backdrop.querySelector("#modalBody");
    var footerEl = backdrop.querySelector("#modalFooter");
    if (opts.body instanceof Node) bodyEl.appendChild(opts.body);
    else bodyEl.innerHTML = opts.body || "";
    if (opts.footer instanceof Node) footerEl.appendChild(opts.footer);
    else footerEl.innerHTML = opts.footer || "";

    function close() { backdrop.remove(); }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    backdrop.querySelector("#modalCloseBtn").addEventListener("click", close);

    if (opts.onMount) opts.onMount(backdrop, close);
    return { close: close, el: backdrop };
  }

  function confirmDialog(opts) {
    openModal({
      title: opts.title,
      body: '<p class="text-secondary">' + escapeHtml(opts.description) + "</p>",
      footer:
        '<button class="btn btn-ghost" id="cdCancel">Cancel</button>' +
        '<button class="btn ' + (opts.dangerless ? "btn-primary" : "btn-danger") + '" id="cdConfirm">' + escapeHtml(opts.confirmLabel || "Delete") + "</button>",
      onMount: function (root, close) {
        root.querySelector("#cdCancel").addEventListener("click", close);
        root.querySelector("#cdConfirm").addEventListener("click", function () {
          close();
          opts.onConfirm();
        });
      },
    });
  }

  // ---------- small helpers ----------
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var STATUS_LABELS = { draft: "Draft", sent: "Sent", partial: "Partial", paid: "Paid", overdue: "Overdue", cancelled: "Cancelled" };
  var STATUS_PILL_CLASS = { draft: "pill-neutral", sent: "pill-accent", partial: "pill-warning", paid: "pill-success", overdue: "pill-danger", cancelled: "pill-neutral" };
  function statusBadge(status) {
    var cls = STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  var PO_STATUS_LABELS = { planned: "Planned", in_progress: "In Progress", done: "Done", cancelled: "Cancelled" };
  var PO_STATUS_PILL_CLASS = { planned: "pill-neutral", in_progress: "pill-warning", done: "pill-success", cancelled: "pill-neutral" };
  function productionStatusBadge(status) {
    var cls = PO_STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = PO_STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  function emptyState(iconKey, title, desc, actionHtml) {
    return (
      '<div class="empty"><div class="icon-wrap">' + (ICONS[iconKey] || "") + "</div>" +
      "<h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(desc) + "</p>" +
      (actionHtml ? '<div class="mt-2">' + actionHtml + "</div>" : "") +
      "</div>"
    );
  }

  // ---------- item-aware line items editor (invoice line items) ----------
  // Each row can optionally be tied to a catalog item (data-field
  // "productId") — picking one auto-fills description + rate from that
  // item's sell price and shows how much finished stock is on hand, but
  // both description and rate stay directly editable afterward. Leaving
  // the picker on "— custom line —" makes it a plain service/fee line
  // that never touches stock. `readOnly` renders a static, non-
  // interactive summary instead (used once an invoice has been sent).
  function createLineItemsEditor(container, items, currency, products, readOnly, getPriceForItem) {
    var state = {
      items: (items && items.length ? items : [{ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 }]).map(function (it) {
        return Object.assign({}, it);
      }),
      currency: currency,
      onChange: null,
    };

    // Selectable options only ever come from active items, and `products`
    // is fixed for the life of this editor instance — so the eligible
    // list is filtered once here, not re-filtered from the full catalog
    // inside productOptionsHtml on every row's render.
    var activeProducts = (products || []).filter(function (p) { return p.active; });

    function amountText(it) {
      return MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.rate || 0)), state.currency);
    }

    function productOptionsHtml(selectedId) {
      var opts = '<option value="">— custom line —</option>';
      opts += activeProducts.map(function (p) {
        var label = p.name + " (" + p.sku + ") — " + MFG.formatCurrency(p.sellPrice, state.currency) + ", " + MFG.formatQty(p.stockQty) + " in stock";
        return '<option value="' + p.id + '"' + (selectedId === p.id ? " selected" : "") + ">" + escapeHtml(label) + "</option>";
      }).join("");
      return opts;
    }

    // Looks up against the full (not active-filtered) product list, since
    // a line item saved against a product that's since been deactivated
    // should still show its real stock hint here, not "Item deleted".
    function stockHint(it) {
      if (!it.productId) return "";
      var p = (products || []).find(function (x) { return x.id === it.productId; });
      if (!p) return '<span class="line-item-stock-hint" style="color:var(--danger);">Item deleted</span>';
      var short = p.stockQty < (Number(it.quantity) || 0);
      return '<span class="line-item-stock-hint"' + (short ? ' style="color:var(--danger);"' : "") + ">" + MFG.formatQty(p.stockQty) + " in stock" + (short ? " — not enough" : "") + "</span>";
    }

    // Wraps one field's label + control so the mobile breakpoint below
    // ~700px (see .line-item-field in styles.css) can show the label
    // above the control when the row reflows from a grid into a stacked
    // card. On wider screens the label stays hidden and the wrapper is
    // just another grid column, so desktop layout is unaffected.
    function fieldWrapper(labelText, innerHtml) {
      return '<div class="line-item-field"><span class="line-item-field-label">' + escapeHtml(labelText) + "</span>" + innerHtml + "</div>";
    }

    function rowHtml(it) {
      if (readOnly) {
        return (
          '<div class="line-item-row line-item-row-readonly" data-row="' + it.id + '">' +
            fieldWrapper("Description", escapeHtml(it.description || "—") + (it.productId ? '<div class="line-item-stock-hint">' + stockHint(it) + "</div>" : "")) +
            fieldWrapper("Qty", MFG.formatQty(it.quantity)) +
            fieldWrapper("Rate", MFG.formatCurrency(it.rate, state.currency)) +
            '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
            "<div></div>" +
          "</div>"
        );
      }
      return (
        '<div class="line-item-row line-item-row-editable" data-row="' + it.id + '">' +
          fieldWrapper("Item", '<select class="input" data-field="productId" aria-label="Item">' + productOptionsHtml(it.productId) + "</select>") +
          fieldWrapper("Description",
            '<input class="input" data-field="description" value="' + escapeHtml(it.description || "") + '" placeholder="Item or service description" aria-label="Item description"/>' +
            (it.productId ? '<div class="line-item-stock-hint" data-stockhint>' + stockHint(it) + "</div>" : "")
          ) +
          fieldWrapper("Qty", '<input class="input" type="number" min="0" step="any" data-field="quantity" value="' + it.quantity + '" aria-label="Quantity"/>') +
          fieldWrapper("Rate", '<input class="input" type="number" min="0" step="any" data-field="rate" value="' + it.rate + '" aria-label="Rate"/>') +
          '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove line item"' + (state.items.length === 1 ? " disabled" : "") + ">" + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      var headCols = readOnly
        ? '<div class="line-items-head line-items-head-readonly"><span>Description</span><span>Qty</span><span>Rate</span><span style="text-align:right;">Amount</span><span></span></div>'
        : '<div class="line-items-head line-items-head-editable"><span>Item</span><span>Description</span><span>Qty</span><span>Rate</span><span style="text-align:right;">Amount</span><span></span></div>';
      container.innerHTML =
        '<div class="line-items' + (readOnly ? " line-items-readonly" : "") + '">' +
          headCols +
          state.items.map(rowHtml).join("") +
          (readOnly ? "" : '<button type="button" class="add-line-btn" id="addLineBtn">' + ICONS.plus + " Add line item</button>") +
        "</div>";
      if (!readOnly) bind();
    }

    function bind() {
      container.querySelectorAll("[data-row]").forEach(function (rowEl) {
        var id = rowEl.getAttribute("data-row");
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          var evt = input.tagName === "SELECT" ? "change" : "input";
          input.addEventListener(evt, function () {
            var field = input.getAttribute("data-field");
            var it = state.items.find(function (x) { return x.id === id; });
            if (!it) return;
            if (field === "description") {
              it.description = input.value;
            } else if (field === "productId") {
              var pid = input.value || null;
              it.productId = pid;
              if (pid) {
                var p = (products || []).find(function (x) { return x.id === pid; });
                if (p) {
                  it.description = p.name;
                  it.rate = (typeof getPriceForItem === "function") ? getPriceForItem(pid, p.sellPrice) : p.sellPrice;
                  var descInput = rowEl.querySelector('[data-field="description"]');
                  if (descInput) descInput.value = it.description;
                  var rateInput = rowEl.querySelector('[data-field="rate"]');
                  if (rateInput) rateInput.value = it.rate;
                }
              }
              render();
              if (state.onChange) state.onChange(state.items);
              return;
            } else {
              it[field] = Number(input.value) || 0;
            }
            var amountEl = rowEl.querySelector(".line-item-amount-value");
            if (amountEl) amountEl.textContent = amountText(it);
            var hintEl = rowEl.querySelector("[data-stockhint]");
            if (hintEl) hintEl.innerHTML = stockHint(it);
            if (state.onChange) state.onChange(state.items);
          });
        });
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) {
          removeBtn.addEventListener("click", function () {
            if (state.items.length === 1) return;
            state.items = state.items.filter(function (x) { return x.id !== id; });
            render();
            if (state.onChange) state.onChange(state.items);
          });
        }
      });
      var addBtn = container.querySelector("#addLineBtn");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          state.items.push({ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 });
          render();
          if (state.onChange) state.onChange(state.items);
        });
      }
    }

    render();

    return {
      getItems: function () { return state.items; },
      setCurrency: function (c) { state.currency = c; render(); },
      onChange: function (fn) { state.onChange = fn; },
    };
  }

  // ---------- BOM (Bill of Materials) editor ----------
  // Used on the Products page when editing a finished-good item: a list
  // of {materialId, qtyPerUnit} rows against the material catalog. Kept
  // as its own small component (distinct from the invoice line items
  // editor above) since it edits a totally different shape of data —
  // "how much of X does one unit of this product need," not a sellable
  // line with its own price.
  function createBomEditor(container, bomLines, materials) {
    var state = {
      lines: (bomLines || []).map(function (l) { return Object.assign({}, l); }),
      onChange: null,
    };

    // `materials` is fixed for the life of this editor instance (one
    // modal-open), so the active-material list backing every row's
    // <select> is filtered once here rather than re-filtered from the
    // full catalog inside materialOptionsHtml on every line's render.
    var activeMaterials = (materials || []).filter(function (m) { return m.active; });

    function materialOptionsHtml(selectedId) {
      var opts = '<option value="">Choose a material…</option>';
      opts += activeMaterials.map(function (m) {
        return '<option value="' + m.id + '"' + (selectedId === m.id ? " selected" : "") + ">" + escapeHtml(m.name + " (" + m.sku + ") — " + MFG.formatQty(m.stockQty) + " " + m.unit + " in stock, " + MFG.formatCurrency(m.costPrice) + "/" + m.unit) + "</option>";
      }).join("");
      return opts;
    }

    function estimatedCost() {
      return state.lines.reduce(function (sum, l) {
        var m = (materials || []).find(function (x) { return x.id === l.materialId; });
        return sum + (m ? m.costPrice * (Number(l.qtyPerUnit) || 0) : 0);
      }, 0);
    }

    function rowHtml(line, idx) {
      return (
        '<div class="bom-row" data-idx="' + idx + '">' +
          '<select class="input" data-field="materialId" aria-label="Material">' + materialOptionsHtml(line.materialId) + "</select>" +
          '<input class="input" type="number" min="0" step="any" data-field="qtyPerUnit" value="' + line.qtyPerUnit + '" aria-label="Quantity per unit"/>' +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove material line">' + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function costFooterHtml() {
      var complete = state.lines.length && state.lines.every(function (l) { return l.materialId; });
      if (!state.lines.length) return "";
      return '<p class="hint bom-cost-footer" style="margin-top:8px;">' +
        (complete ? "Estimated material cost per unit: <strong style=\"color:var(--text);\">" + escapeHtml(MFG.formatCurrency(estimatedCost())) + "</strong> — auto-fills the Cost price field above." : "Pick a material on every line to see the estimated cost.") +
        "</p>";
    }

    function render() {
      if (!state.lines.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;margin-bottom:10px;">No materials added yet — this item has no Bill of Materials, so Production can\'t make it. Add at least one material below.</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="bomAddBtn">' + ICONS.plus + " Add material</button>";
      } else {
        container.innerHTML =
          '<div class="bom-head"><span>Material</span><span>Qty per unit made</span><span></span></div>' +
          state.lines.map(rowHtml).join("") +
          '<button type="button" class="btn btn-secondary btn-sm mt-1" id="bomAddBtn">' + ICONS.plus + " Add material</button>" +
          costFooterHtml();
      }
      bind();
    }

    function updateFooterInPlace() {
      var footer = container.querySelector(".bom-cost-footer");
      if (footer) footer.outerHTML = costFooterHtml();
    }

    function bind() {
      container.querySelectorAll("[data-idx]").forEach(function (rowEl) {
        var idx = Number(rowEl.getAttribute("data-idx"));
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          var isSelect = input.tagName === "SELECT";
          input.addEventListener(isSelect ? "change" : "input", function () {
            var field = input.getAttribute("data-field");
            state.lines[idx][field] = field === "qtyPerUnit" ? Number(input.value) || 0 : input.value;
            // A material select swap can change every row's option list
            // (nothing here depends on that today, but keeps this in step
            // with the invoice line-items editor's pattern) — safe to
            // re-render fully. The qty input fires on every keystroke, so
            // it only patches the cost footer text in place; a full
            // render() there would rebuild the DOM mid-keystroke and throw
            // focus out of the field.
            if (isSelect) render(); else updateFooterInPlace();
            if (state.onChange) state.onChange(state.lines);
          });
        });
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) removeBtn.addEventListener("click", function () { state.lines.splice(idx, 1); render(); if (state.onChange) state.onChange(state.lines); });
      });
      var addBtn = container.querySelector("#bomAddBtn");
      if (addBtn) addBtn.addEventListener("click", function () { state.lines.push({ materialId: "", qtyPerUnit: 1 }); render(); if (state.onChange) state.onChange(state.lines); });
    }

    render();

    return {
      getLines: function () { return state.lines.filter(function (l) { return l.materialId; }); },
      onChange: function (fn) { state.onChange = fn; },
    };
  }

  // ---------- Customer-specific pricing editor (Customers page) ----------
  // A sparse list of {itemId, price} overrides against the finished-goods
  // catalog, edited on a customer's own record. When an override exists
  // for a given customer + item, the invoice line-items editor (above)
  // uses it instead of that item's normal sellPrice the moment the item
  // is picked on a line — see MFG.customerPriceForItem in store.js.
  function createPriceOverridesEditor(container, overrides, finishedGoods) {
    var state = {
      lines: (overrides || []).map(function (o) { return Object.assign({}, o); }),
    };
    var items = finishedGoods || [];

    function itemOptionsHtml(selectedId) {
      var opts = '<option value="">Choose an item…</option>';
      opts += items.map(function (it) {
        return '<option value="' + it.id + '"' + (selectedId === it.id ? " selected" : "") + ">" + escapeHtml(it.name + " (" + it.sku + ") — normally " + MFG.formatCurrency(it.sellPrice)) + "</option>";
      }).join("");
      return opts;
    }

    function rowHtml(line, idx) {
      return (
        '<div class="bom-row" data-idx="' + idx + '">' +
          '<select class="input" data-field="itemId" aria-label="Item">' + itemOptionsHtml(line.itemId) + "</select>" +
          '<input class="input" type="number" min="0" step="any" data-field="price" value="' + line.price + '" aria-label="Custom price"/>' +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove price override">' + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      if (!items.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;">Add a finished good on the Products page first, then come back here to give this customer a special price on it.</p>';
        return;
      }
      if (!state.lines.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;margin-bottom:10px;">No custom prices for this customer — every item uses its normal sell price on their invoices.</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="poAddBtn">' + ICONS.plus + " Add a custom price</button>";
      } else {
        container.innerHTML =
          '<div class="bom-head"><span>Item</span><span>Their price</span><span></span></div>' +
          state.lines.map(rowHtml).join("") +
          '<button type="button" class="btn btn-secondary btn-sm mt-1" id="poAddBtn">' + ICONS.plus + " Add a custom price</button>";
      }
      bind();
    }

    function bind() {
      container.querySelectorAll("[data-idx]").forEach(function (rowEl) {
        var idx = Number(rowEl.getAttribute("data-idx"));
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          var evt = input.tagName === "SELECT" ? "change" : "input";
          input.addEventListener(evt, function () {
            var field = input.getAttribute("data-field");
            state.lines[idx][field] = field === "price" ? Number(input.value) || 0 : input.value;
          });
        });
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) removeBtn.addEventListener("click", function () { state.lines.splice(idx, 1); render(); });
      });
      var addBtn = container.querySelector("#poAddBtn");
      if (addBtn) addBtn.addEventListener("click", function () { state.lines.push({ itemId: "", price: 0 }); render(); });
    }

    render();

    return {
      getLines: function () { return state.lines.filter(function (l) { return l.itemId; }); },
    };
  }

  // ---------- Kanban board renderer (Advanced production mode) ----------
  // `columns` = [{ key, label, cards: [{ id, html }] }]. Pure render —
  // the caller wires up clicks afterward with querySelectorAll, same
  // pattern as every other page in this suite (build HTML, then bind()).
  function kanbanBoardHtml(columns) {
    return (
      '<div class="kanban-board">' +
        columns.map(function (col) {
          return (
            '<div class="kanban-col">' +
              '<div class="kanban-col-head"><span>' + escapeHtml(col.label) + '</span><span class="kanban-count">' + col.cards.length + "</span></div>" +
              '<div class="kanban-col-body">' +
                (col.cards.length ? col.cards.map(function (c) { return '<div class="kanban-card" data-card="' + c.id + '">' + c.html + "</div>"; }).join("") :
                  '<div class="kanban-empty">Nothing here</div>') +
              "</div>" +
            "</div>"
          );
        }).join("") +
      "</div>"
    );
  }

  // ---------- Excel export ----------
  // Built entirely locally by lib/xlsx-writer.js (inlined only into the
  // settings page, which is the only page that needs it) — no CDN, so
  // this works with zero network access instead of failing with
  // "check your internet connection" whenever the SheetJS CDN is
  // unreachable (corporate firewalls, ad blockers, offline use, or —
  // as in this app's own build/test sandbox — no internet at all).
  function downloadWorkbook(sheetName, rows, filename) {
    return downloadWorkbookMulti([{ name: sheetName, rows: rows }], filename);
  }
  function downloadWorkbookMulti(sheets, filename) {
    return global.XLSXWriter.downloadWorkbookMulti(sheets, filename);
  }

  // ---------- printable document window ----------
  // Opens a new tab with a minimal, self-contained print-friendly page and
  // triggers the browser's print dialog — this is how invoices and credit
  // notes become PDFs, with no external library and no server needed
  // ("Save as PDF" is a print destination in every modern browser). Kept
  // strictly black/white/grey to match the app's own monochrome identity.
  var PRINT_CSS =
    "@media print{@page{margin:16mm 14mm;}}" +
    "*{box-sizing:border-box;}" +
    "body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;padding:44px;max-width:800px;margin:0 auto;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact;}" +
    "h1{font-family:Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;}" +
    "h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#555;margin:26px 0 8px;}" +
    ".muted{color:#666;font-size:12px;margin:1px 0;}" +
    ".letterhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}" +
    ".company-block .logo{max-height:44px;max-width:220px;margin-bottom:10px;display:block;}" +
    ".doc-block{text-align:right;min-width:180px;}" +
    ".doc-type{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:6px;}" +
    ".doc-meta{font-size:12px;color:#444;margin:2px 0;}" +
    ".doc-meta span{color:#888;display:inline-block;min-width:64px;}" +
    ".doc-number{display:inline-block;font-weight:700;font-size:13px;background:#111;color:#fff;padding:3px 10px;border-radius:3px;letter-spacing:.02em;margin-bottom:6px;}" +
    ".rule{border:none;border-top:2.5px solid #111;margin:20px 0 0;}" +
    ".bill-to{background:#f6f6f6;border-radius:6px;padding:14px 16px;margin-top:22px;}" +
    ".bill-to .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:4px;}" +
    ".bill-to .name{font-weight:700;font-size:14px;}" +
    "table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}" +
    "thead tr{border-bottom:2px solid #111;}" +
    "th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#333;}" +
    "td{padding:10px;border-bottom:1px solid #eee;}" +
    "tbody tr:nth-child(even){background:#fafafa;}" +
    "td.num,th.num{text-align:right;}" +
    ".total-box{margin-top:10px;display:flex;justify-content:flex-end;}" +
    ".total-box .inner{background:#111;color:#fff;padding:12px 20px;border-radius:6px;min-width:220px;display:flex;justify-content:space-between;align-items:center;gap:20px;}" +
    ".total-box .inner .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}" +
    ".total-box .inner .value{font-size:19px;font-weight:700;}" +
    ".doc-footer{margin-top:36px;padding-top:14px;border-top:1px solid #ddd;display:flex;justify-content:space-between;gap:20px;}" +
    ".doc-footer .thanks{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;color:#333;}" +
    ".doc-footer .stamp{font-size:10.5px;color:#999;text-align:right;}" +
    "@media print{body{padding:0;}}";

  function printLetterhead(settings, docType, docNumber, metaLines) {
    return (
      '<div class="letterhead">' +
        '<div class="company-block">' +
          (settings.logoDataUrl ? '<img class="logo" src="' + settings.logoDataUrl + '" />' : "") +
          "<h1>" + escapeHtml(settings.businessName || "Your Business") + "</h1>" +
          (settings.address ? '<p class="muted">' + escapeHtml(settings.address) + "</p>" : "") +
          [settings.email, settings.phone, settings.website].filter(Boolean).map(function (v) { return '<p class="muted">' + escapeHtml(v) + "</p>"; }).join("") +
        "</div>" +
        '<div class="doc-block">' +
          '<div class="doc-type">' + escapeHtml(docType) + "</div>" +
          (docNumber ? '<div class="doc-number">' + escapeHtml(docNumber) + "</div>" : "") +
          metaLines.map(function (m) { return '<p class="doc-meta"><span>' + escapeHtml(m.label) + "</span>" + escapeHtml(m.value) + "</p>"; }).join("") +
        "</div>" +
      "</div>" +
      '<hr class="rule"/>'
    );
  }

  function openPrintWindow(title, bodyHtml) {
    var win = window.open("", "_blank");
    if (!win) { toast("Your browser blocked the print window pop-up — allow pop-ups for this site and try again.", "error"); return; }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>" + escapeHtml(title) + "</title>" +
      "<style>" + PRINT_CSS + "</style></head><body>" + bodyHtml +
      // Split across concatenated string pieces on purpose (this whole
      // file gets inlined into a real <script> element by the build
      // step, and the literal closing-tag text appearing anywhere in
      // this file's raw source would truncate everything after it).
      "<" + "script>window.onload=function(){setTimeout(function(){window.print();},150);};" + "<" + "/script>" +
      "</body></html>"
    );
    win.document.close();
  }

  // Builds and opens a printable invoice document, including any credit
  // applied — used both from the invoice editor and the invoices list.
  function printInvoice(invoice, customer, settings, payments, creditNotes) {
    var totals = MFG.computeTotals(invoice);
    var paid = MFG.amountPaid(invoice.id, payments || []);
    var creditApplied = MFG.creditAppliedForInvoice(invoice.id, creditNotes || []);
    var balance = MFG.round2(totals.total - paid - creditApplied);
    var rowsHtml = (invoice.items || []).map(function (it) {
      return "<tr><td>" + escapeHtml(it.description || "—") + "</td>" +
        "<td class='num'>" + it.quantity + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(it.rate, invoice.currency) + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.rate || 0)), invoice.currency) + "</td></tr>";
    }).join("");
    var metaLines = [
      { label: "Issued", value: MFG.formatDate(invoice.issueDate) },
      { label: "Due", value: MFG.formatDate(invoice.dueDate) },
    ];
    var billLines = customer ? [customer.name, customer.company, customer.email, customer.address].filter(Boolean) : ["—"];
    var settledLine = creditApplied > 0
      ? '<div class="total-box"><div class="inner" style="background:#666;"><span class="label">Credit Applied</span><span class="value">-' + MFG.formatCurrency(creditApplied, invoice.currency) + "</span></div></div>"
      : "";
    var html =
      printLetterhead(settings, "INVOICE", invoice.number, metaLines) +
      '<div class="bill-to">' +
        '<div class="label">Bill To</div>' +
        billLines.map(function (l, i) { return '<div class="' + (i === 0 ? "name" : "muted") + '">' + escapeHtml(l) + "</div>"; }).join("") +
      "</div>" +
      "<table><thead><tr><th>Description</th><th class='num'>Qty</th><th class='num'>Rate</th><th class='num'>Amount</th></tr></thead><tbody>" +
      rowsHtml +
      "</tbody></table>" +
      settledLine +
      '<div class="total-box"><div class="inner">' +
        '<span class="label">' + ((paid > 0 || creditApplied > 0) ? "Balance Due" : "Total") + "</span>" +
        '<span class="value">' + MFG.formatCurrency((paid > 0 || creditApplied > 0) ? balance : totals.total, invoice.currency) + "</span>" +
      "</div></div>" +
      (invoice.notes ? '<h2>Notes</h2><p class="muted">' + escapeHtml(invoice.notes) + "</p>" : "") +
      (settings.paymentInstructions ? '<h2>Payment Instructions</h2><p class="muted">' + escapeHtml(settings.paymentInstructions) + "</p>" : "") +
      '<div class="doc-footer"><div class="thanks">Thank you for your business.</div><div class="stamp">Generated ' + MFG.formatDate(MFG.todayISO()) + "</div></div>";
    openPrintWindow("Invoice " + invoice.number, html);
  }

  // Prints a standalone credit-note document — its own applications (if
  // any) are listed so it's clear at a glance where the credit has gone.
  function printCreditNote(creditNote, customer, settings) {
    var applied = (creditNote.applications || []).reduce(function (sum, a) { return sum + a.amount; }, 0);
    var remaining = MFG.round2(creditNote.amount - applied);
    var metaLines = [{ label: "Issued", value: MFG.formatDate(creditNote.date) }, { label: "Reason", value: creditNote.reason || "—" }];
    var billLines = customer ? [customer.name, customer.company, customer.email, customer.address].filter(Boolean) : ["—"];
    var appliedRows = (creditNote.applications || []).map(function (a) {
      return "<tr><td>" + escapeHtml(MFG.formatDate(a.date)) + "</td><td class='num'>" + MFG.formatCurrency(a.amount) + "</td></tr>";
    }).join("");
    var html =
      printLetterhead(settings, "CREDIT NOTE", "CN-" + creditNote.id.slice(0, 8).toUpperCase(), metaLines) +
      '<div class="bill-to">' +
        '<div class="label">Issued To</div>' +
        billLines.map(function (l, i) { return '<div class="' + (i === 0 ? "name" : "muted") + '">' + escapeHtml(l) + "</div>"; }).join("") +
      "</div>" +
      (creditNote.note ? '<h2>Note</h2><p class="muted">' + escapeHtml(creditNote.note) + "</p>" : "") +
      (appliedRows ? "<h2>Applied To</h2><table><thead><tr><th>Date</th><th class='num'>Amount</th></tr></thead><tbody>" + appliedRows + "</tbody></table>" : "") +
      '<div class="total-box"><div class="inner">' +
        '<span class="label">Remaining Credit</span><span class="value">' + MFG.formatCurrency(remaining) + "</span>" +
      "</div></div>" +
      '<div class="doc-footer"><div class="thanks">Thank you for your business.</div><div class="stamp">Generated ' + MFG.formatDate(MFG.todayISO()) + "</div></div>";
    openPrintWindow("Credit Note", html);
  }

  global.MFGUI = {
    ICONS: ICONS,
    applyAccent: applyAccent,
    renderShell: renderShell,
    showStorageBanner: showStorageBanner,
    hideStorageBanner: hideStorageBanner,
    toast: toast,
    openModal: openModal,
    confirmDialog: confirmDialog,
    escapeHtml: escapeHtml,
    emptyState: emptyState,
    statusBadge: statusBadge,
    productionStatusBadge: productionStatusBadge,
    createLineItemsEditor: createLineItemsEditor,
    createBomEditor: createBomEditor,
    createPriceOverridesEditor: createPriceOverridesEditor,
    kanbanBoardHtml: kanbanBoardHtml,
    el: el,
    qs: qs,
    BUILD_DATE: BUILD_DATE,
    downloadWorkbook: downloadWorkbook,
    downloadWorkbookMulti: downloadWorkbookMulti,
    openPrintWindow: openPrintWindow,
    printLetterhead: printLetterhead,
    printInvoice: printInvoice,
    printCreditNote: printCreditNote,
  };
})(window);

</script>
<script>
/* Invoice editor page — create or edit (?id=<invoiceId>)
   ---------------------------------------------------------
   Line items can be tied to a catalog item (see the item picker inside
   MFGUI.createLineItemsEditor), and a DRAFT invoice is fully editable
   and stock-neutral. Sending it (Save & Send, or Send from an existing
   draft) is the one moment stock is touched — atomically, and only if
   every item-linked line has enough on hand; see MFG.sendInvoice /
   MFG.stockShortagesForInvoice in store.js. Once sent, the form and
   line items lock: to change what was actually sold, cancel the
   invoice (which restores the stock) and start over, or issue a
   follow-up invoice. Credit notes are a separate ledger — apply one
   from here once the invoice has been sent. */
(function () {
  "use strict";

  var shell = MFGUI.renderShell("invoices");

  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var data = MFG.getData();
  var existing = id ? data.invoices.find(function (i) { return i.id === id; }) : undefined;

  if (id && !existing) {
    shell.setTitle("Invoice not found", "");
    shell.contentEl.innerHTML =
      '<div class="empty" style="padding-top:64px;">' +
        '<div class="icon-wrap">' + MFGUI.ICONS.invoices + "</div>" +
        "<h3>This invoice could not be found</h3><p>It may have been deleted.</p>" +
        '<div class="mt-2"><a class="btn btn-secondary btn-sm" href="invoices.html">Back to Invoices</a></div>' +
      "</div>";
    return;
  }

  var CURRENCIES = MFG.CURRENCY_CODES.slice().sort();

  // Locked = an existing invoice that isn't (or is no longer) a draft.
  // A brand-new invoice is always editable; only an existing invoice
  // carries a status that can lock it.
  function rawStatus() { return existing ? existing.status : "draft"; }
  function isDraft() { return rawStatus() === "draft"; }

  var state = existing
    ? {
        customerId: existing.customerId,
        issueDate: existing.issueDate,
        dueDate: existing.dueDate,
        items: existing.items && existing.items.length ? existing.items : [{ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 }],
        taxRate: existing.taxRate,
        discountType: existing.discountType,
        discountValue: existing.discountValue,
        currency: existing.currency,
        notes: existing.notes || "",
      }
    : {
        customerId: data.customers.length === 1 ? data.customers[0].id : "",
        issueDate: MFG.todayISO(),
        dueDate: MFG.addDays(MFG.todayISO(), 14),
        items: [{ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 }],
        taxRate: data.settings.defaultTaxRate,
        discountType: "percent",
        discountValue: 0,
        currency: data.settings.currency,
        notes: "",
      };

  var lineItemsEditor = null;

  function customerOptionsHtml() {
    if (data.customers.length === 0) return "";
    return '<option value="">Select a customer…</option>' + data.customers.map(function (c) {
      return '<option value="' + c.id + '"' + (state.customerId === c.id ? " selected" : "") + ">" + MFGUI.escapeHtml(c.name) + (c.company ? " — " + MFGUI.escapeHtml(c.company) : "") + "</option>";
    }).join("");
  }

  function customer() {
    return data.customers.find(function (c) { return c.id === state.customerId; });
  }

  function currentTotals() {
    return MFG.computeTotals(state);
  }

  function paidAmount() {
    return existing ? MFG.amountPaid(existing.id, data.payments) : 0;
  }
  function creditApplied() {
    return existing ? MFG.creditAppliedForInvoice(existing.id, data.creditNotes) : 0;
  }
  function currentStatus() {
    var totals = currentTotals();
    return existing ? MFG.derivedStatus(existing, MFG.round2(paidAmount() + creditApplied()), totals.total) : "draft";
  }

  function openCreditNotesForCustomer() {
    if (!existing) return [];
    return data.creditNotes.filter(function (cn) {
      return cn.customerId === existing.customerId && MFG.remainingCredit(cn) > 0;
    });
  }

  function renderHeaderActions() {
    if (!existing) return "";
    var raw = rawStatus();
    var totals = currentTotals();
    var balance = MFG.round2(totals.total - paidAmount() - creditApplied());
    var html = "";
    if (raw === "sent" && balance > 0) {
      html += '<button class="btn btn-secondary btn-sm" id="payBtn">' + MFGUI.ICONS.wallet + " Record Payment</button>";
      if (openCreditNotesForCustomer().length > 0) {
        html += '<button class="btn btn-secondary btn-sm" id="applyCreditBtn">' + MFGUI.ICONS.creditNote + " Apply Credit</button>";
      }
    }
    html += '<button class="btn btn-secondary btn-sm" id="duplicateBtn">' + MFGUI.ICONS.copy + " Duplicate</button>";
    if (raw === "sent") html += '<button class="btn btn-secondary btn-sm" id="cancelBtn">' + MFGUI.ICONS.ban + " Cancel Invoice</button>";
    if (raw === "cancelled") html += '<button class="btn btn-secondary btn-sm" id="reopenBtn">' + MFGUI.ICONS.rotateCcw + " Reopen as Draft</button>";
    html += '<button class="btn btn-danger btn-sm" id="deleteBtn">' + MFGUI.ICONS.trash + " Delete</button>";
    return html;
  }

  function renderTotalsSummary() {
    var totals = currentTotals();
    var html = '<div class="summary-list">';
    html += '<div class="summary-row"><span>Subtotal</span><span>' + MFG.formatCurrency(totals.subtotal, state.currency) + "</span></div>";
    if (totals.discount > 0) html += '<div class="summary-row"><span>Discount</span><span>-' + MFG.formatCurrency(totals.discount, state.currency) + "</span></div>";
    if (totals.tax > 0) html += '<div class="summary-row"><span>Tax (' + state.taxRate + '%)</span><span>' + MFG.formatCurrency(totals.tax, state.currency) + "</span></div>";
    html += '<div class="summary-row total"><span>Total</span><span>' + MFG.formatCurrency(totals.total, state.currency) + "</span></div>";
    if (existing) {
      var paid = paidAmount();
      var credit = creditApplied();
      if (paid > 0 || credit > 0) {
        var balance = MFG.round2(totals.total - paid - credit);
        if (paid > 0) html += '<div class="summary-row success"><span>Paid</span><span>-' + MFG.formatCurrency(paid, state.currency) + "</span></div>";
        if (credit > 0) html += '<div class="summary-row success"><span>Credit Applied</span><span>-' + MFG.formatCurrency(credit, state.currency) + "</span></div>";
        html += '<div class="summary-row balance"><span>Balance due</span><span>' + MFG.formatCurrency(balance, state.currency) + "</span></div>";
      }
    }
    html += "</div>";
    return html;
  }

  function render() {
    var status = currentStatus();
    var draft = isDraft();
    shell.setActions("");
    shell.contentEl.innerHTML =
      '<div class="max-width-editor">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
          '<a href="invoices.html" style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);text-decoration:none;font-size:13px;">&larr; Invoices</a>' +
          (existing ? MFGUI.statusBadge(status) : "") +
        "</div>" +
        '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">' +
          "<h1 style=\"font-size:20px;font-weight:650;\">" + (existing ? "Invoice " + MFGUI.escapeHtml(existing.number) : "New Invoice") + "</h1>" +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;" id="headerActions">' + renderHeaderActions() + "</div>" +
        "</div>" +

        (draft ? "" :
          '<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--surface-2,var(--surface));">' +
            MFGUI.ICONS.alert +
            '<p class="text-secondary" style="font-size:12.5px;margin:0;">' +
              (raw() === "cancelled"
                ? "This invoice is cancelled and read-only. Reopen it to edit, or duplicate it into a fresh draft."
                : "This invoice has been sent, so its stock deduction is locked in and the details below are read-only. Cancel it to restore stock and make changes, or duplicate it into a fresh draft.") +
            "</p>" +
          "</div>"
        ) +

        '<div class="card section-card">' +
          '<div class="form-grid">' +
            '<div class="field"><label>Customer<span class="req">*</span></label>' +
            (data.customers.length === 0
              ? '<p class="text-tertiary" style="font-size:13px;border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px;">No customers yet. <a href="customers.html" style="color:var(--text);">Add one first</a>.</p>'
              : '<select class="input" id="fCustomer"' + (draft ? "" : " disabled") + '>' + customerOptionsHtml() + "</select>") +
            '<span class="error hidden" id="fCustomerErr">Select a customer.</span></div>' +
            '<div class="field"><label>Currency</label><select class="input" id="fCurrency"' + (draft ? "" : " disabled") + '>' +
              CURRENCIES.map(function (c) { return '<option value="' + c + '"' + (state.currency === c ? " selected" : "") + ">" + c + " (" + MFGUI.escapeHtml(MFG.currencySymbol(c)) + ")</option>"; }).join("") +
            "</select></div>" +
            '<div class="field"><label>Issue date</label><input class="input" type="date" id="fIssue" value="' + state.issueDate + '"' + (draft ? "" : " disabled") + "/></div>" +
            '<div class="field"><label>Due date</label><input class="input" type="date" id="fDue" value="' + state.dueDate + '"' + (draft ? "" : " disabled") + "/></div>" +
          "</div>" +
        "</div>" +

        '<div class="card section-card">' +
          "<h2>Line Items</h2>" +
          (draft ? '<p class="text-secondary" style="font-size:12px;margin-top:-8px;margin-bottom:12px;">Pick an item to auto-fill its price and see live stock — or leave it as a custom line for a one-off fee or service. Pick the customer above first if they have a custom price on file (set on their Customers page profile).</p>' : "") +
          '<span class="error hidden" id="fItemsErr" style="display:block;margin-bottom:10px;">Add at least one line item.</span>' +
          '<div id="lineItemsContainer"></div>' +
        "</div>" +

        '<div class="card section-card">' +
          '<div class="form-grid" style="grid-template-columns:repeat(3,1fr);">' +
            '<div class="field"><label>Tax rate (%)</label><input class="input" type="number" min="0" step="any" id="fTax" value="' + state.taxRate + '"' + (draft ? "" : " disabled") + "/></div>" +
            '<div class="field"><label>Discount type</label><select class="input" id="fDiscType"' + (draft ? "" : " disabled") + '>' +
              '<option value="percent"' + (state.discountType === "percent" ? " selected" : "") + ">Percent (%)</option>" +
              '<option value="fixed"' + (state.discountType === "fixed" ? " selected" : "") + ">Fixed amount</option>" +
            "</select></div>" +
            '<div class="field"><label>Discount value</label><input class="input" type="number" min="0" step="any" id="fDiscValue" value="' + state.discountValue + '"' + (draft ? "" : " disabled") + "/></div>" +
          "</div>" +
          '<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;" id="totalsSummary">' + renderTotalsSummary() + "</div>" +
        "</div>" +

        '<div class="card section-card">' +
          '<div class="field"><label>Notes</label><textarea class="input" id="fNotes" rows="3" placeholder="Thanks for your business!"' + (draft ? "" : " disabled") + '>' + MFGUI.escapeHtml(state.notes) + "</textarea>" +
          '<span class="hint">Shown on the printed invoice, under Payment Instructions (set the default instructions themselves in Settings).</span></div>' +
        "</div>" +

        '<div class="editor-actionbar">' +
          '<button class="btn btn-secondary btn-sm" id="printBtn">' + MFGUI.ICONS.print + " Print / Save as PDF</button>" +
          (draft
            ? '<button class="btn btn-secondary btn-sm" id="saveDraftBtn">' + MFGUI.ICONS.pencil + " Save Draft</button>" +
              '<button class="btn btn-primary btn-sm" id="saveSendBtn">' + MFGUI.ICONS.mail + " Save &amp; Send</button>"
            : "") +
        "</div>" +
      "</div>";

    lineItemsEditor = MFGUI.createLineItemsEditor(
      document.getElementById("lineItemsContainer"),
      state.items,
      state.currency,
      data.items.filter(function (it) { return it.type === "finished"; }),
      !draft,
      function (itemId, defaultPrice) {
        if (!state.customerId) return defaultPrice;
        var override = MFG.customerPriceForItem(state.customerId, itemId);
        return override == null ? defaultPrice : override;
      }
    );
    if (draft) {
      lineItemsEditor.onChange(function (items) {
        state.items = items;
        refreshTotals();
      });
    }

    bind();
  }

  function raw() { return rawStatus(); }

  function refreshTotals() {
    var el = document.getElementById("totalsSummary");
    if (el) el.innerHTML = renderTotalsSummary();
  }

  function readFormIntoState() {
    if (!isDraft()) return;
    if (data.customers.length > 0) state.customerId = document.getElementById("fCustomer").value;
    state.currency = document.getElementById("fCurrency").value;
    state.issueDate = document.getElementById("fIssue").value;
    state.dueDate = document.getElementById("fDue").value;
    state.taxRate = Number(document.getElementById("fTax").value) || 0;
    state.discountType = document.getElementById("fDiscType").value;
    state.discountValue = Number(document.getElementById("fDiscValue").value) || 0;
    state.notes = document.getElementById("fNotes").value.trim();
    state.items = lineItemsEditor.getItems();
  }

  function validate() {
    var ok = true;
    document.getElementById("fItemsErr").classList.add("hidden");
    var customerErr = document.getElementById("fCustomerErr");
    if (customerErr) customerErr.classList.add("hidden");
    if (!state.customerId) {
      if (customerErr) customerErr.classList.remove("hidden");
      ok = false;
    }
    var hasDescription = state.items.some(function (it) { return (it.description || "").trim(); });
    if (!hasDescription) {
      document.getElementById("fItemsErr").classList.remove("hidden");
      ok = false;
    }
    return ok;
  }

  function buildPayload() {
    return {
      customerId: state.customerId,
      issueDate: state.issueDate,
      dueDate: state.dueDate,
      items: state.items,
      taxRate: state.taxRate,
      discountType: state.discountType,
      discountValue: state.discountValue,
      currency: state.currency,
      notes: state.notes || undefined,
    };
  }

  function showShortages(shortages) {
    var body = '<p class="text-secondary" style="font-size:13px;margin-bottom:10px;">There isn’t enough stock to send this invoice:</p>' +
      '<div class="divider-list">' + shortages.map(function (s) {
        return '<div class="row"><span>' + MFGUI.escapeHtml(s.name) + '</span><span class="text-secondary" style="font-size:12px;">need ' + s.needed + " " + MFGUI.escapeHtml(s.unit) + ", have " + s.available + " " + MFGUI.escapeHtml(s.unit) + "</span></div>";
      }).join("") + "</div>" +
      '<p class="text-tertiary" style="font-size:12px;margin-top:10px;">Restock those items (or make more via Production), or adjust the quantities on this invoice, then try sending again. Your changes here have been kept as a draft.</p>';
    MFGUI.openModal({
      title: "Not enough stock to send",
      body: body,
      footer: '<button class="btn btn-primary" id="okBtn">Got it</button>',
      onMount: function (root, close) { root.querySelector("#okBtn").addEventListener("click", close); },
    });
  }

  function bind() {
    ["fCurrency", "fIssue", "fDue", "fTax", "fDiscType", "fDiscValue"].forEach(function (fieldId) {
      var el = document.getElementById(fieldId);
      if (!el) return;
      el.addEventListener("input", function () { readFormIntoState(); refreshTotals(); });
      el.addEventListener("change", function () {
        readFormIntoState();
        if (fieldId === "fCurrency") lineItemsEditor.setCurrency(state.currency);
        refreshTotals();
      });
    });
    var customerSel = document.getElementById("fCustomer");
    if (customerSel) customerSel.addEventListener("change", readFormIntoState);
    var notesEl = document.getElementById("fNotes");
    if (notesEl) notesEl.addEventListener("input", readFormIntoState);

    document.getElementById("printBtn").addEventListener("click", function () {
      readFormIntoState();
      if (!validate()) return;
      var invoice = existing
        ? Object.assign({}, existing, isDraft() ? buildPayload() : {})
        : Object.assign({ id: "preview", number: MFG.nextInvoiceNumber(), status: "draft", createdAt: MFG.nowISO(), updatedAt: MFG.nowISO() }, buildPayload());
      MFGUI.printInvoice(invoice, customer(), data.settings, data.payments, data.creditNotes);
    });

    var saveDraftBtn = document.getElementById("saveDraftBtn");
    if (saveDraftBtn) {
      saveDraftBtn.addEventListener("click", function () {
        readFormIntoState();
        if (!validate()) return;
        if (existing) {
          var res = MFG.updateDraftInvoice(existing.id, buildPayload());
          if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
          MFGUI.toast("Draft saved.");
          data = MFG.getData();
          existing = data.invoices.find(function (i) { return i.id === id; });
          render();
        } else {
          var added = MFG.addInvoice(Object.assign({ status: "draft" }, buildPayload()));
          MFGUI.toast("Draft saved.");
          window.location.href = "editor.html?id=" + added.invoice.id;
        }
      });
    }

    var saveSendBtn = document.getElementById("saveSendBtn");
    if (saveSendBtn) {
      saveSendBtn.addEventListener("click", function () {
        readFormIntoState();
        if (!validate()) return;

        if (!existing) {
          // Save as a draft first, then attempt to send it. This way a
          // stock shortage never loses the work that was just typed in —
          // the invoice already exists (as a draft) by the time the
          // shortage is reported.
          var draftAdd = MFG.addInvoice(Object.assign({ status: "draft" }, buildPayload()));
          id = draftAdd.invoice.id;
          window.history.replaceState(null, "", "editor.html?id=" + id);
          var sendRes = MFG.sendInvoice(id);
          data = MFG.getData();
          existing = data.invoices.find(function (i) { return i.id === id; });
          if (!sendRes.ok) { showShortages(sendRes.shortages); render(); return; }
          MFGUI.toast("Invoice sent and stock updated.");
          offerPostSendActions(sendRes.invoice);
          render();
          return;
        }

        var draftRes = MFG.updateDraftInvoice(existing.id, buildPayload());
        if (!draftRes.ok) { MFGUI.toast(draftRes.error, "error"); return; }
        var sendRes = MFG.sendInvoice(existing.id);
        if (!sendRes.ok) { showShortages(sendRes.shortages); data = MFG.getData(); existing = data.invoices.find(function (i) { return i.id === id; }); render(); return; }
        MFGUI.toast("Invoice sent and stock updated.");
        offerPostSendActions(sendRes.invoice);
        data = MFG.getData();
        existing = data.invoices.find(function (i) { return i.id === id; });
        render();
      });
    }

    // Deliberately NOT automatic: this used to redirect the whole tab to
    // a mailto: link on a timer right after sending, with no confirmation.
    // On a machine with no default mail app configured, that redirect can
    // sit there waiting on an OS-level "choose an app" prompt — which
    // looks exactly like the page freezing. Showing an explicit modal
    // instead means sending an invoice never has a surprise side effect,
    // and it's honest about what a browser can and can't do: mailto:
    // opens a blank compose window with no way to attach a file (no web
    // page can attach files to it — that's a browser/OS limit, not
    // something this app can work around), so the PDF has to be
    // downloaded and attached by hand either way.
    function offerPostSendActions(invoice) {
      var c = customer();
      var body =
        '<p class="text-secondary" style="font-size:13px;">Invoice ' + MFGUI.escapeHtml(invoice.number) + " was sent and stock was updated." + "</p>" +
        '<p class="text-tertiary" style="font-size:12px;">Browsers can\'t attach a file to an email automatically — download the PDF first, then attach it yourself in the email that opens.</p>';
      MFGUI.openModal({
        title: "Invoice Sent",
        body: body,
        footer:
          '<button class="btn btn-secondary btn-sm" id="psPdfBtn">' + MFGUI.ICONS.print + " Download PDF</button>" +
          (c && c.email ? '<button class="btn btn-secondary btn-sm" id="psEmailBtn">' + MFGUI.ICONS.mail + " Email " + MFGUI.escapeHtml(c.name) + "</button>" : "") +
          '<button class="btn btn-primary btn-sm" id="psDoneBtn">Done</button>',
        onMount: function (root, close) {
          root.querySelector("#psDoneBtn").addEventListener("click", close);
          root.querySelector("#psPdfBtn").addEventListener("click", function () {
            MFGUI.printInvoice(invoice, c, data.settings, data.payments, data.creditNotes);
          });
          var emailBtn = root.querySelector("#psEmailBtn");
          if (emailBtn) {
            emailBtn.addEventListener("click", function () {
              var totals = MFG.computeTotals(invoice);
              var subject = encodeURIComponent("Invoice " + invoice.number + " from " + data.settings.businessName);
              var mailBody = encodeURIComponent(
                "Hi " + c.name + ",\n\nPlease find invoice " + invoice.number + " for " + MFG.formatCurrency(totals.total, invoice.currency) +
                ", due " + invoice.dueDate + ".\n\n(Attach the PDF you just downloaded before sending.)\n\nThank you!\n" + data.settings.businessName
              );
              // window.open, not location.href — opens the mail app/tab
              // without navigating this one away, so there's nothing here
              // for a missing mail handler to hang or lose work on.
              window.open("mailto:" + c.email + "?subject=" + subject + "&body=" + mailBody, "_blank");
            });
          }
        },
      });
    }

    var payBtn = document.getElementById("payBtn");
    if (payBtn) payBtn.addEventListener("click", openPaymentModal);

    var applyCreditBtn = document.getElementById("applyCreditBtn");
    if (applyCreditBtn) applyCreditBtn.addEventListener("click", openApplyCreditModal);

    var dupBtn = document.getElementById("duplicateBtn");
    if (dupBtn) {
      dupBtn.addEventListener("click", function () {
        var copy = MFG.addInvoice({
          status: "draft",
          customerId: existing.customerId,
          issueDate: MFG.todayISO(),
          dueDate: MFG.addDays(MFG.todayISO(), 14),
          items: existing.items.map(function (it) { return Object.assign({}, it, { id: MFG.uid() }); }),
          taxRate: existing.taxRate,
          discountType: existing.discountType,
          discountValue: existing.discountValue,
          currency: existing.currency,
          notes: existing.notes,
        });
        MFGUI.toast("Invoice duplicated as a new draft.");
        window.location.href = "editor.html?id=" + copy.invoice.id;
      });
    }

    var cancelBtn = document.getElementById("cancelBtn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function () {
        MFGUI.confirmDialog({
          title: "Cancel invoice?",
          description: "This restores any stock it deducted and marks the invoice as cancelled. It will no longer count toward outstanding balances.",
          confirmLabel: "Cancel Invoice",
          onConfirm: function () {
            MFG.cancelInvoice(existing.id);
            MFGUI.toast("Invoice cancelled and stock restored.");
            data = MFG.getData();
            existing = data.invoices.find(function (i) { return i.id === id; });
            render();
          },
        });
      });
    }

    var reopenBtn = document.getElementById("reopenBtn");
    if (reopenBtn) {
      reopenBtn.addEventListener("click", function () {
        MFGUI.confirmDialog({
          title: "Reopen as draft?",
          description: "This makes the invoice editable again. Sending it a second time will re-check stock fresh.",
          confirmLabel: "Reopen",
          dangerless: true,
          onConfirm: function () {
            MFG.reopenInvoice(existing.id);
            MFGUI.toast("Invoice reopened as a draft.");
            data = MFG.getData();
            existing = data.invoices.find(function (i) { return i.id === id; });
            render();
          },
        });
      });
    }

    var deleteBtn = document.getElementById("deleteBtn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function () {
        MFGUI.confirmDialog({
          title: "Delete invoice?",
          description: "This permanently deletes the invoice and any payments recorded against it. If it was sent, its stock deduction is restored first, and any credit notes applied to it are freed up again.",
          confirmLabel: "Delete",
          onConfirm: function () {
            MFG.deleteInvoice(existing.id);
            MFGUI.toast("Invoice deleted.", "info");
            window.location.href = "invoices.html";
          },
        });
      });
    }
  }

  function openPaymentModal() {
    var totals = currentTotals();
    var balance = MFG.round2(totals.total - paidAmount() - creditApplied());
    var body =
      '<p class="text-tertiary" style="font-size:12px;">Balance due: <strong style="color:var(--text);">' + MFG.formatCurrency(balance, state.currency) + "</strong></p>" +
      '<div class="field"><label>Amount<span class="req">*</span></label><input class="input" type="number" min="0" step="any" id="pAmount" value="' + balance + '"/>' +
      '<span class="error hidden" id="pAmountErr">Enter an amount greater than zero.</span></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Date</label><input class="input" type="date" id="pDate" value="' + MFG.todayISO() + '"/></div>' +
        '<div class="field"><label>Method</label><select class="input" id="pMethod">' +
          ["Bank Transfer", "Credit Card", "Cash", "Check", "PayPal", "Other"].map(function (m) { return '<option value="' + m + '">' + m + "</option>"; }).join("") +
        "</select></div>" +
      "</div>" +
      '<div class="field"><label>Note</label><textarea class="input" id="pNote" rows="2" placeholder="Optional reference number, etc."></textarea></div>';

    MFGUI.openModal({
      title: "Record Payment",
      body: body,
      footer: '<button class="btn btn-ghost" id="cancelModalBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Record Payment</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelModalBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var amount = Number(root.querySelector("#pAmount").value);
          if (!amount || amount <= 0) {
            root.querySelector("#pAmount").classList.add("has-error");
            root.querySelector("#pAmountErr").classList.remove("hidden");
            return;
          }
          MFG.recordPayment({
            invoiceId: existing.id,
            amount: amount,
            date: root.querySelector("#pDate").value || MFG.todayISO(),
            method: root.querySelector("#pMethod").value,
            note: root.querySelector("#pNote").value.trim() || undefined,
          });
          MFGUI.toast("Payment recorded.");
          close();
          data = MFG.getData();
          existing = data.invoices.find(function (i) { return i.id === id; });
          render();
        });
      },
    });
  }

  function openApplyCreditModal() {
    var candidates = openCreditNotesForCustomer();
    if (!candidates.length) { MFGUI.toast("This customer has no open credit notes.", "error"); return; }
    var totals = currentTotals();
    var balance = MFG.round2(totals.total - paidAmount() - creditApplied());
    var body =
      '<div class="field"><label>Credit note</label><select class="input" id="cnSelect">' +
        candidates.map(function (cn) {
          return '<option value="' + cn.id + '">' + MFGUI.escapeHtml(cn.reason || "Credit") + " — " + MFG.formatCurrency(MFG.remainingCredit(cn)) + " remaining</option>";
        }).join("") +
      "</select></div>" +
      '<p class="text-tertiary" style="font-size:12px;">Invoice balance due: <strong style="color:var(--text);">' + MFG.formatCurrency(balance, state.currency) + "</strong></p>" +
      '<div class="field"><label>Amount to apply<span class="req">*</span></label><input class="input" type="number" min="0" step="any" id="cnAmount" value="' + Math.min(balance, MFG.remainingCredit(candidates[0])) + '"/>' +
      '<span class="error hidden" id="cnAmountErr">Enter a valid amount.</span></div>';

    MFGUI.openModal({
      title: "Apply Credit Note",
      body: body,
      footer: '<button class="btn btn-ghost" id="cancelModalBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Apply Credit</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelModalBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var cnId = root.querySelector("#cnSelect").value;
          var amount = Number(root.querySelector("#cnAmount").value);
          var res = MFG.applyCreditNote(cnId, existing.id, amount);
          if (!res.ok) {
            root.querySelector("#cnAmountErr").textContent = res.error;
            root.querySelector("#cnAmountErr").classList.remove("hidden");
            return;
          }
          MFGUI.toast("Credit applied to this invoice.");
          close();
          data = MFG.getData();
          existing = data.invoices.find(function (i) { return i.id === id; });
          render();
        });
      },
    });
  }

  render();
})();

</script>
</body>
</html>
