        readFormIntoState();
        if (!validate()) return;
        if (existing) {
          var res = MFG.updateDraftPurchaseOrder(existing.id, buildPayload());
          if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
          MFGUI.toast("Draft saved.");
          data = MFG.getData();
          existing = data.purchaseOrders.find(function (p) { return p.id === id; });
          render();
        } else {
          var added = MFG.addPurchaseOrder(Object.assign({ status: "draft" }, buildPayload()));
          MFGUI.toast("Draft saved.");
          window.location.href = "po-editor.html?id=" + added.purchaseOrder.id;
        }
      });
    }

    var saveSendBtn = document.getElementById("saveSendBtn");
    if (saveSendBtn) {
      saveSendBtn.addEventListener("click", function () {
        readFormIntoState();
        if (!validate()) return;

        if (!existing) {
          var added = MFG.addPurchaseOrder(Object.assign({ status: "sent" }, buildPayload()));
          id = added.purchaseOrder.id;
          window.history.replaceState(null, "", "po-editor.html?id=" + id);
          data = MFG.getData();
          existing = data.purchaseOrders.find(function (p) { return p.id === id; });
          MFGUI.toast("Purchase order sent.");
          offerPostSendActions(added.purchaseOrder);
          render();
          return;
        }

        var draftRes = MFG.updateDraftPurchaseOrder(existing.id, buildPayload());
        if (!draftRes.ok) { MFGUI.toast(draftRes.error, "error"); return; }
        var sendRes = MFG.sendPurchaseOrder(existing.id);
        if (!sendRes.ok) { MFGUI.toast(sendRes.error, "error"); return; }
        MFGUI.toast("Purchase order sent.");
        offerPostSendActions(sendRes.purchaseOrder);
        data = MFG.getData();
        existing = data.purchaseOrders.find(function (p) { return p.id === id; });
        render();
      });
    }

    var receiveBtn = document.getElementById("receiveBtn");
    if (receiveBtn) receiveBtn.addEventListener("click", openReceiveModal);

    var dupBtn = document.getElementById("duplicateBtn");
    if (dupBtn) {
      dupBtn.addEventListener("click", function () {
        var copy = MFG.addPurchaseOrder({
          status: "draft",
          vendorId: existing.vendorId,
          issueDate: MFG.todayISO(),
          expectedDate: undefined,
          items: existing.items.map(function (it) { return Object.assign({}, it, { id: MFG.uid(), receivedQty: 0 }); }),
          currency: existing.currency,
          notes: existing.notes,
        });
        MFGUI.toast("Purchase order duplicated as a new draft.");
        window.location.href = "po-editor.html?id=" + copy.purchaseOrder.id;
      });
    }

    var cancelBtn = document.getElementById("cancelBtn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function () {
        MFGUI.confirmDialog({
          title: "Cancel purchase order?",
          description: "This marks the purchase order as cancelled. Anything already received stays in stock — cancelling only closes out what hasn't arrived yet.",
          confirmLabel: "Cancel Purchase Order",
          onConfirm: function () {
            var res = MFG.cancelPurchaseOrder(existing.id);
            if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
            MFGUI.toast("Purchase order cancelled.");
            data = MFG.getData();
            existing = data.purchaseOrders.find(function (p) { return p.id === id; });
            render();
          },
        });
      });
    }

    var deleteBtn = document.getElementById("deleteBtn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function () {
        MFGUI.confirmDialog({
          title: "Delete purchase order?",
          description: "This permanently deletes the purchase order. Only possible because nothing on it has been received yet.",
          confirmLabel: "Delete",
          onConfirm: function () {
            var res = MFG.deletePurchaseOrder(existing.id);
            if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
            MFGUI.toast("Purchase order deleted.", "info");
            window.location.href = "purchase-orders.html";
          },
        });
      });
    }

    function refreshExisting() {
      data = MFG.getData();
      existing = data.purchaseOrders.find(function (p) { return p.id === id; });
    }

    var recordPayBtn = document.getElementById("recordPayBtn");
    if (recordPayBtn) {
      recordPayBtn.addEventListener("click", function () {
        MFGUI.openVendorPaymentModal(existing, function () {
          refreshExisting();
          render();
        });
      });
    }
    shell.contentEl.querySelectorAll("[data-remove-pay]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var payId = btn.getAttribute("data-remove-pay");
        MFGUI.confirmDialog({
          title: "Delete payment record?",
          description: "This will increase this purchase order's balance due again.",
          confirmLabel: "Delete",
          onConfirm: function () {
            MFG.deleteVendorPayment(payId);
            MFGUI.toast("Payment removed.", "info");
            refreshExisting();
            render();
          },
        });
      });
    });

    var attAddBtn = document.getElementById("attAddBtn");
    var attInput = document.getElementById("attInput");
    if (attAddBtn && attInput) {
      attAddBtn.addEventListener("click", function () { attInput.click(); });
      attInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        if (file.size > MFG.ATTACHMENT_MAX_BYTES) {
          MFGUI.toast("That file is too large — attachments are capped at " + Math.round(MFG.ATTACHMENT_MAX_BYTES / 1024 / 1024 * 10) / 10 + "MB each.", "error");
          attInput.value = "";
          return;
        }
        var kind = document.getElementById("attKind").value;
        var reader = new FileReader();
        reader.onload = function () {
          var res = MFG.addPoAttachment(existing.id, {
            name: file.name,
            mimeType: file.type || "application/octet-stream",
            size: file.size,
            dataUrl: reader.result,
            kind: kind,
          });
          if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
          MFGUI.toast("Attachment added.");
          refreshExisting();
          render();
        };
        reader.readAsDataURL(file);
      });
    }
    shell.contentEl.querySelectorAll("[data-remove-att]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var attId = btn.getAttribute("data-remove-att");
        MFGUI.confirmDialog({
          title: "Remove attachment?",
          description: "This permanently deletes the file from this purchase order.",
          confirmLabel: "Remove",
          onConfirm: function () {
            MFG.removePoAttachment(existing.id, attId);
            MFGUI.toast("Attachment removed.", "info");
            refreshExisting();
            render();
          },
        });
      });
    });
  }

  render();
})();

</script>
</body>
</html>
