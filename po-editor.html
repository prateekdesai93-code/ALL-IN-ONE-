<style>
/* =========================================================
   Manufacturing & Invoicing Manager — Design System
   A dark or light neutral base (pick in Settings → Theme) with one
   confident indigo brand accent, plus a distinct color per sidebar
   section — used on nav icons, the current-page indicator, and stat
   card icons — so the app reads as colorful and it's always obvious
   at a glance which part of it you're in. No build step, no frameworks.
   ========================================================= */

:root {
  --bg: #000000;
  --surface: #000000;
  --surface-2: #0e0e0e;
  --surface-hover: #1a1a1a;
  --border: #262626;
  --border-strong: #404040;
  --text: #ffffff;
  --text-secondary: #a8a8a8;
  --text-tertiary: #707070;

  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.18);
  --accent-text: #a5b4fc;
  --accent-contrast: #ffffff;

  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.14);
  --warning: #facc15;
  --warning-soft: rgba(250, 204, 21, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);

  /* One color per sidebar destination — always used on that section's
     nav icon, and reused on the page-title indicator and any stat/metric
     card that reports on that section, so the same color always means
     the same part of the app. */
  --sec-dashboard: #60a5fa; --sec-dashboard-soft: rgba(96, 165, 250, 0.18);
  --sec-products: #a78bfa; --sec-products-soft: rgba(167, 139, 250, 0.18);
  --sec-bom: #a3e635; --sec-bom-soft: rgba(163, 230, 53, 0.18);
  --sec-vendors: #fb923c; --sec-vendors-soft: rgba(251, 146, 60, 0.18);
  --sec-purchase-orders: #2dd4bf; --sec-purchase-orders-soft: rgba(45, 212, 191, 0.18);
  --sec-accounts-payable: #fb7185; --sec-accounts-payable-soft: rgba(251, 113, 133, 0.18);
  --sec-production: #e879f9; --sec-production-soft: rgba(232, 121, 249, 0.18);
  --sec-customers: #22d3ee; --sec-customers-soft: rgba(34, 211, 238, 0.18);
  --sec-invoices: #818cf8; --sec-invoices-soft: rgba(129, 140, 248, 0.18);
  --sec-credit-notes: #f472b6; --sec-credit-notes-soft: rgba(244, 114, 182, 0.18);
  --sec-payments: #34d399; --sec-payments-soft: rgba(52, 211, 153, 0.18);
  --sec-reports: #fbbf24; --sec-reports-soft: rgba(251, 191, 36, 0.18);
  --sec-settings: #94a3b8; --sec-settings-soft: rgba(148, 163, 184, 0.18);

  --radius-lg: 16px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.6);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.85);
  --accent-glow: rgba(99, 102, 241, 0.4);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --sidebar-w: 248px;
}

/* Light theme — same indigo accent and section colors, deepened for
   contrast on a white background. Toggle in Settings → Theme sets
   data-theme="light" on <html>. */
html[data-theme="light"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f2f2f2;
  --surface-hover: #e6e6e6;
  --border: #dcdcdc;
  --border-strong: #bfbfbf;
  --text: #000000;
  --text-secondary: #4d4d4d;
  --text-tertiary: #767676;

  --accent: #4f46e5;
  --accent-soft: rgba(79, 70, 229, 0.12);
  --accent-text: #4338ca;
  --accent-contrast: #ffffff;

  --success: #15803d;
  --success-soft: rgba(21, 128, 61, 0.12);
  --warning: #b45309;
  --warning-soft: rgba(180, 83, 9, 0.12);
  --danger: #b91c1c;
  --danger-soft: rgba(185, 28, 28, 0.12);

  --sec-dashboard: #2563eb; --sec-dashboard-soft: rgba(37, 99, 235, 0.12);
  --sec-products: #7c3aed; --sec-products-soft: rgba(124, 58, 237, 0.12);
  --sec-bom: #4d7c0f; --sec-bom-soft: rgba(77, 124, 15, 0.12);
  --sec-vendors: #ea580c; --sec-vendors-soft: rgba(234, 88, 12, 0.12);
  --sec-purchase-orders: #0d9488; --sec-purchase-orders-soft: rgba(13, 148, 136, 0.12);
  --sec-accounts-payable: #e11d48; --sec-accounts-payable-soft: rgba(225, 29, 72, 0.12);
  --sec-production: #c026d3; --sec-production-soft: rgba(192, 38, 211, 0.12);
  --sec-customers: #0891b2; --sec-customers-soft: rgba(8, 145, 178, 0.12);
  --sec-invoices: #4f46e5; --sec-invoices-soft: rgba(79, 70, 229, 0.12);
  --sec-credit-notes: #db2777; --sec-credit-notes-soft: rgba(219, 39, 119, 0.12);
  --sec-payments: #059669; --sec-payments-soft: rgba(5, 150, 105, 0.12);
  --sec-reports: #b45309; --sec-reports-soft: rgba(180, 83, 9, 0.12);
  --sec-settings: #475569; --sec-settings-soft: rgba(71, 85, 105, 0.12);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.08);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.2);
  --accent-glow: rgba(79, 70, 229, 0.25);
}

/* Blue theme — a third choice alongside pure-black Dark and white Light:
   a near-black midnight base with a blue undertone instead of true black,
   with a brighter blue brand accent to match. Darker than the first pass —
   the background reads as "black with a hint of blue" rather than a
   lighter navy panel. Same section-color system as the other two themes
   (the palette already reads clearly against a dark background), so
   switching themes never changes which color means which part of the app.
   Toggle in Settings → Theme sets data-theme="blue" on <html>. */
html[data-theme="blue"] {
  --bg: #03060c;
  --surface: #050a14;
  --surface-2: #0a1220;
  --surface-hover: #101a2c;
  --border: #182740;
  --border-strong: #223757;
  --text: #e6edf7;
  --text-secondary: #8ba0bf;
  --text-tertiary: #55677f;

  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.2);
  --accent-text: #93c5fd;
  --accent-contrast: #ffffff;

  --success: #4ade80;
  --success-soft: rgba(74, 222, 128, 0.16);
  --warning: #fbbf24;
  --warning-soft: rgba(251, 191, 36, 0.16);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.16);

  --sec-dashboard: #60a5fa; --sec-dashboard-soft: rgba(96, 165, 250, 0.2);
  --sec-products: #a78bfa; --sec-products-soft: rgba(167, 139, 250, 0.2);
  --sec-bom: #a3e635; --sec-bom-soft: rgba(163, 230, 53, 0.2);
  --sec-vendors: #fb923c; --sec-vendors-soft: rgba(251, 146, 60, 0.2);
  --sec-purchase-orders: #2dd4bf; --sec-purchase-orders-soft: rgba(45, 212, 191, 0.2);
  --sec-accounts-payable: #fb7185; --sec-accounts-payable-soft: rgba(251, 113, 133, 0.2);
  --sec-production: #e879f9; --sec-production-soft: rgba(232, 121, 249, 0.2);
  --sec-customers: #22d3ee; --sec-customers-soft: rgba(34, 211, 238, 0.2);
  --sec-invoices: #818cf8; --sec-invoices-soft: rgba(129, 140, 248, 0.2);
  --sec-credit-notes: #f472b6; --sec-credit-notes-soft: rgba(244, 114, 182, 0.2);
  --sec-payments: #34d399; --sec-payments-soft: rgba(52, 211, 153, 0.2);
  --sec-reports: #fbbf24; --sec-reports-soft: rgba(251, 191, 36, 0.2);
  --sec-settings: #94a3b8; --sec-settings-soft: rgba(148, 163, 184, 0.2);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-2: 0 16px 40px -14px rgba(0, 0, 0, 0.7);
  --accent-glow: rgba(59, 130, 246, 0.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
a { color: inherit; }
button { font-family: inherit; }
h1, h2, h3, p { margin: 0; }
::selection { background: var(--accent-soft); color: var(--text); }

img { max-width: 100%; display: block; }

/* ---------- Layout ---------- */
.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  z-index: 40;
  transition: transform 0.25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 20px;
}
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--sec-products), var(--sec-purchase-orders));
  display: flex; align-items: center; justify-content: center;
  color: #ffffff; font-weight: 700; font-size: 15px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px -4px var(--accent-glow);
}
.brand-text { min-width: 0; }
.brand-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--text-tertiary); }

.nav { display: flex; flex-direction: column; gap: 14px; flex: 1; overflow-y: auto; }
/* Main tab (section) / sub tab (page) grouping — each .nav-group is one
   main tab (an unclickable section label, since every sub tab underneath
   stays visible with nothing to expand/collapse) holding its sub tabs. */
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  padding: 0 12px 2px 9px;
}
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 9px;
  border-radius: var(--radius-sm);
  border-left: 3px solid transparent;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
/* Every nav icon (and its mobile-topbar twin) sits in its own softly-
   tinted color chip (--nc / --nc-soft are set inline per row in ui.js,
   referencing that section's --sec-* variables — see renderShell) so the
   sidebar reads as colorful even before anything is selected. */
.nav-icon-chip {
  width: 26px; height: 26px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--nc-soft); color: var(--nc);
  flex-shrink: 0;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-icon-chip svg { width: 15px; height: 15px; }
.nav-link:hover { background: var(--surface-hover); color: var(--text); }
/* The active tab gets FOUR reinforcing signals at once — a solid-filled
   icon chip, a colored left bar, a tinted row background, and bold
   text — all in that section's own color, so which page you're on is
   obvious at a glance without having to read the label. */
.nav-link.active {
  background: var(--nc-soft);
  color: var(--nc);
  border-left-color: var(--nc);
  font-weight: 700;
}
.nav-link.active .nav-icon-chip { background: var(--nc); color: #ffffff; }

.sidebar-footer {
  font-size: 10.5px;
  color: var(--text-tertiary);
  padding: 10px 12px 2px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
}

/* ---------- Storage-degraded banner ---------- */
/* Shown when a write to localStorage has failed (store.js flips
   MFG.isStorageDegraded() and calls MFGUI.showStorageBanner()) — the
   change only made it into an in-memory fallback and will be lost on
   refresh/close unless the visitor exports a backup. Reuses the app's
   existing danger/red token, no new color introduced. */
.storage-banner {
  position: sticky; top: 0; left: 0; right: 0;
  z-index: 45;
  background: var(--danger-soft);
  color: var(--danger);
  border-bottom: 1px solid var(--danger);
  padding: 10px 16px;
  font-size: 12.5px;
  font-weight: 600;
  text-align: center;
}
.storage-banner a { color: inherit; text-decoration: underline; font-weight: 700; }

.mobile-topbar {
  display: none;
  position: sticky; top: 0;
  align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.mobile-menu-btn {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
/* The mobile topbar's whole reason to exist: name the page you're
   actually on. The sidebar (with its own active-tab highlight) is
   hidden behind the hamburger below ~768px, so this is the only
   always-visible answer to "where am I" on a phone. Colored to match
   that page's own nav icon for the same at-a-glance recognition. */
.mobile-topbar-current {
  display: flex; align-items: center; gap: 10px; min-width: 0;
}
.mobile-topbar-current .nav-icon-chip { background: var(--nc); color: #ffffff; }
.mobile-topbar-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Same colored icon chip, reused beside the desktop page title so the
   current section's color shows up there too, not just in the sidebar. */
.page-icon-chip {
  width: 30px; height: 30px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  background: var(--nc); color: #ffffff;
  flex-shrink: 0;
}
.page-icon-chip svg { width: 16px; height: 16px; }

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 32px 0;
}
.topbar-heading { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
.topbar .sub { margin-top: 3px; font-size: 13px; color: var(--text-secondary); }
.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

.content {
  padding: 20px 32px 56px;
  flex: 1;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
  padding: 8px 14px;
  text-decoration: none;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* Safety net: any inline SVG icon not covered by a more specific rule
   below still needs an explicit size, or Chromium can collapse it to
   0x0 inside auto-sized flex containers (a real, confirmed bug — not
   theoretical). Specific rules after this one win via normal cascade
   order/specificity, so this only fills gaps. */
svg { width: 16px; height: 16px; flex-shrink: 0; }
.mobile-menu-btn svg { width: 20px; height: 20px; }
.btn-icon svg { width: 16px; height: 16px; }
.card-link svg { width: 14px; height: 14px; }
.stat-card .icon-wrap svg { width: 18px; height: 18px; }
.empty .icon-wrap svg { width: 22px; height: 22px; }
.lock-mark svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 6px 18px -8px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { filter: brightness(0.9); }
.btn-secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; }
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }
.btn-icon.neutral:hover { background: var(--surface-hover); color: var(--text); }

/* ---------- Cards / stats ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}
.card-header h2 { font-size: 13.5px; font-weight: 650; }
.card-link { font-size: 12px; font-weight: 600; color: var(--accent-text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.card-link:hover { text-decoration: underline; }
.card-body { padding: 20px; }

/* auto-fit rather than a hardcoded column count so a page with 5 stat
   cards (Dashboard, once Total Payable is added) wraps as gracefully as
   the 4-card pages (Reports) — no per-page override needed either way. */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
/* --nc / --nc-soft are set inline per card (see dashboard.js / reports.js)
   to that card's own section or semantic color variable; var()'s second
   argument is the fallback when a card doesn't set one, so an uncolored
   card just renders neutral instead of needing a separate CSS class. */
.stat-card .icon-wrap {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--nc-soft, var(--surface-2)); color: var(--nc, var(--text-secondary));
}
.stat-card .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.stat-card .label { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
.stat-card .sub { font-size: 11px; color: var(--text-tertiary); }

/* ---------- Grid helpers ---------- */
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.flex-col { display: flex; flex-direction: column; gap: 6px; }
.divider-list > * + * { border-top: 1px solid var(--border); }

/* ---------- List rows ---------- */
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 20px;
}
.row .title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.row .meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ---------- Pills ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  border: 1px solid transparent;
}
.pill-success { background: var(--success-soft); color: var(--success); }
.pill-warning { background: var(--warning-soft); color: var(--warning); }
.pill-danger { background: var(--danger-soft); color: var(--danger); }
.pill-neutral { background: var(--surface-2); color: var(--text-secondary); border-color: var(--border-strong); }
.pill-accent { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
.field label .req { color: var(--danger); margin-left: 2px; }
.field .hint { font-size: 11px; color: var(--text-tertiary); }
.field .error { font-size: 11.5px; color: var(--danger); }
.input, select.input, textarea.input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.has-error { border-color: var(--danger); }
textarea.input { resize: vertical; min-height: 72px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.single { grid-template-columns: 1fr; }

/* ---------- Filters / tabs ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text-secondary);
  padding: 6px 13px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover { background: var(--surface-hover); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 40px 20px;
  color: var(--text-secondary);
}
.empty .icon-wrap {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface-2); color: var(--text-tertiary);
  display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
}
.empty h3 { font-size: 14px; font-weight: 650; color: var(--text); }
.empty p { font-size: 12.5px; max-width: 320px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(4, 7, 11, 0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  backdrop-filter: blur(2px);
  animation: fadeIn 0.15s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 480px;
  max-height: 88vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 14.5px; font-weight: 650; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Toasts ---------- */
/* Bottom-right, not top-right: the topbar's own action button (e.g. "New
   Production Order") lives at top-right too, so a toast firing right
   after a click there used to land directly on top of it. */
.toast-root {
  position: fixed; bottom: 16px; right: 16px; z-index: 200;
  display: flex; flex-direction: column-reverse; gap: 8px;
  max-width: 320px;
}
.toast {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  color: var(--text);
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-2);
  animation: slideUp 0.18s ease;
}
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--text-tertiary); }

/* ---------- Accent swatches ---------- */
.swatch-row { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 40px; height: 40px; border-radius: 999px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.swatch:hover { transform: scale(1.06); }
.swatch.active { border-color: var(--text); }

/* ---------- Skeleton ---------- */
.skeleton { background: var(--surface-2); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ---------- Utility ---------- */
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-warning { color: var(--warning); }
.text-danger { color: var(--danger); }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 14px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.min-w-0 { min-width: 0; }
.hidden { display: none !important; }
.logo-preview {
  width: 64px; height: 64px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- Lock screen (access-code gate) ---------- */
html:not(.unlocked) #app-shell,
html:not(.unlocked) .mobile-topbar {
  display: none !important;
}
.lock-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 20px;
}
.lock-card {
  width: 100%; max-width: 360px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  text-align: center;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow-2);
}
.lock-mark {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--sec-products), var(--sec-purchase-orders));
  color: #ffffff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
  margin: 0 auto 4px;
}
.lock-card h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.lock-card p.lock-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: -8px; }
.lock-card .lock-error {
  display: none;
  font-size: 12px;
  color: var(--danger);
  margin-top: -6px;
}
.lock-card .lock-error.show { display: block; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-2); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  body.sidebar-open .sidebar-backdrop { display: block; }
  .main { margin-left: 0; }
  .mobile-topbar { display: flex; }
  .topbar { padding: 18px 18px 0; flex-wrap: wrap; }
  .content { padding: 16px 18px 48px; }
  .topbar-actions .btn span.long { display: none; }
}

/* =========================================================
   Invoice Generator — additional components
   (tables, line-item editor, editor summary) built on top of
   the design system above. No new colors introduced.
   ========================================================= */

/* ---------- Data table ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
table.table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: 13px; }
table.table thead tr { background: var(--surface-2); border-bottom: 1px solid var(--border); }
table.table th { text-align: left; padding: 11px 16px; font-weight: 600; font-size: 11.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.02em; }
table.table th.num, table.table td.num { text-align: right; }
table.table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.table tbody tr:last-child td { border-bottom: none; }
table.table tbody tr:hover { background: var(--surface-hover); }
table.table a { color: var(--text); font-weight: 600; text-decoration: none; }
table.table a:hover { text-decoration: underline; }
.table-actions { display: flex; justify-content: flex-end; gap: 2px; }

/* ---------- Filter chips row already covered by .chip-row / .chip ---------- */

/* ---------- Line items editor ---------- */
/* One unified panel instead of a loose stack of separately-boxed fields:
   the whole list — header, every row, the "Add line item" action — lives
   inside one bordered, rounded container with thin row dividers, like a
   single clean table. Individual inputs stay borderless/transparent until
   hovered or focused (see ".line-item-row .input" below), so a row with
   4-6 fields in it reads as one line of text rather than a cluster of
   separately-boxed inputs. This same component backs both the invoice
   line items (editor.js) and the purchase-order line items (po-editor.js)
   editors, so the redesign applies to both automatically. */
.line-items {
  display: flex; flex-direction: column;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
}
.line-items-head {
  display: grid; grid-template-columns: 1fr 70px 110px 110px 32px; gap: 10px;
  padding: 10px 16px; font-size: 11px; font-weight: 650; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.03em;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.line-item-row {
  display: grid; grid-template-columns: 1fr 70px 110px 110px 32px; gap: 10px; align-items: center;
  padding: 9px 16px;
  border-bottom: 1px solid var(--border);
}
.line-item-row:hover { background: var(--surface-hover); }
/* Editable rows carry one extra column (the item picker) that the
   read-only summary rows don't — give them their own 6-column template
   instead of overflowing the 5-column one above. 148px (not the old
   fixed 200px holding a native <select>) is sized for the compact
   "Choose item" trigger button below, which never overflows its column
   the way a long <option> label used to — that mismatch was what made
   rows look like differently-sized boxes stacked together. */
.line-items-head-editable,
.line-item-row-editable {
  grid-template-columns: 148px 1fr 70px 110px 110px 32px;
}

/* The per-row item picker trigger — replaces what used to be a native
   <select> crammed with "name (sku) — price, stock" in one unbroken
   line. Same visual weight as the boxless inputs beside it (see
   ".line-item-row .input" below) until hovered/focused, so the row still
   reads as one line rather than a button awkwardly wedged in. */
.line-item-choose-btn {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 7px 8px; font: inherit; font-size: 12.5px; color: var(--text-secondary); cursor: pointer;
  text-align: left;
}
.line-item-choose-btn.has-item { color: var(--text); font-weight: 600; }
.line-item-choose-btn:hover, .line-item-choose-btn:focus-visible {
  background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none;
}
.line-item-choose-btn svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-tertiary); }
.line-item-choose-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Catalog picker modal (invoice items, PO items, BOM materials) ---------- */
/* One shared searchable picker (MFGUI.openCatalogPickerModal) instead of
   a native <select> full of "name (sku) — price, stock" text — used
   anywhere a row needs to choose from a product/material catalog. */
.picker-search { margin-bottom: 12px; }
.picker-list { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow-y: auto; margin: -4px; padding: 4px; }
.picker-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
}
.picker-row-info { flex: 1; min-width: 0; }
.picker-row-info .name { font-weight: 600; font-size: 13px; }
.picker-row-info .meta { font-size: 11.5px; color: var(--text-tertiary); margin-top: 2px; }
.picker-row-qty { width: 72px; flex-shrink: 0; }
.picker-row-qty input { text-align: center; }
.picker-row .btn { flex-shrink: 0; }
.picker-row.picked { border-color: var(--success); background: var(--success-soft); }
.picker-empty { text-align: center; padding: 24px 12px; color: var(--text-tertiary); font-size: 12.5px; }
.line-item-amount { text-align: right; font-size: 13px; font-weight: 600; padding-right: 4px; }
.line-item-field { min-width: 0; }
.line-item-field-label { display: none; }

/* Boxless-until-touched: a plain select/input inside a line-item row has
   no visible border or fill, so the row reads as one line of data. A
   light box appears on hover, and the normal accent focus ring appears on
   focus, so the editable area is still obvious once you interact with it. */
.line-item-row .input {
  background: transparent;
  border: 1px solid transparent;
  padding: 7px 8px;
}
.line-item-row .input:hover { background: var(--surface); border-color: var(--border); }
.line-item-row .input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.line-items-footer { padding: 10px 12px; background: var(--surface-2); display: flex; gap: 8px; flex-wrap: wrap; }
.add-line-btn {
  flex: 1; min-width: 160px; justify-content: center;
  border: 1px dashed var(--border-strong); background: transparent; color: var(--text-secondary);
  padding: 8px 14px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.add-line-btn:hover { border-color: var(--accent); color: var(--text); background: var(--surface-hover); }
.add-line-btn svg { width: 14px; height: 14px; }
.add-line-btn.primary { border-style: solid; border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.add-line-btn.primary:hover { background: var(--accent-soft); filter: brightness(1.15); }

/* Below ~700px a 5-6 column grid doesn't fit a phone screen, and letting
   it overflow-scroll (like .table-wrap) would make the app's core
   editing workflow — typing invoice line items — miserable. Reflow each
   row into its own labeled card instead (the single-panel treatment above
   is a desktop-only trick); the stock hint stays right under the
   description field where it already sits. Inputs go back to a visible
   box here since there's no persistent header row labeling each column. */
@media (max-width: 700px) {
  .line-items { border: none; border-radius: 0; background: transparent; gap: 10px; }
  .line-items-head { display: none; }
  .line-item-row,
  .line-item-row-editable,
  .line-item-row-readonly {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 14px 44px 14px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    position: relative;
  }
  .line-item-row:hover { background: var(--surface-2); }
  .line-item-row .input,
  .line-item-row .input:hover {
    background: var(--surface); border-color: var(--border-strong); padding: 9px 12px;
  }
  .line-item-field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .line-item-amount {
    text-align: left;
    padding-right: 0;
    padding-top: 4px;
    border-top: 1px dashed var(--border);
  }
  .line-item-amount-value { font-size: 15px; }
  .line-item-row [data-remove] {
    position: absolute;
    top: 12px;
    right: 12px;
  }
  .line-items-footer { padding: 0; background: transparent; }
}

/* ---------- Totals summary ---------- */
.summary-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.summary-row { display: flex; justify-content: space-between; color: var(--text-secondary); }
.summary-row.total { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; font-size: 15px; font-weight: 700; color: var(--text); }
.summary-row.success { color: var(--success); }
.summary-row.balance { font-weight: 700; color: var(--text); }

/* ---------- Editor action bar ---------- */
/* Deliberately NOT position:sticky. It used to stick to the bottom of
   the viewport with a negative bottom margin pulling it up into the
   content area — on a short invoice (little to scroll), that meant the
   bar sat permanently on top of the last card (Notes), blocking clicks
   into it. A normal in-flow bar can never cover anything above it. */
.editor-actionbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  margin-top: 4px;
  display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
}

/* ---------- Section card heading ---------- */
.section-card { padding: 20px; }
.section-card h2 { font-size: 13.5px; font-weight: 650; margin-bottom: 14px; }
.max-width-editor { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.max-width-form { max-width: 720px; }

/* ---------- BOM (Bill of Materials) editor — Products page ---------- */
.bom-head {
  display: grid; grid-template-columns: 1fr 160px 32px; gap: 10px;
  padding: 0 2px 6px; font-size: 11px; font-weight: 600; color: var(--text-tertiary);
}
.bom-row {
  display: grid; grid-template-columns: 1fr 160px 32px; gap: 10px; align-items: center;
  margin-bottom: 8px;
}
@media (max-width: 640px) {
  .bom-head { display: none; }
  .bom-row { grid-template-columns: 1fr 100px 32px; }
}

/* ---------- Segmented control (Simple/Advanced production mode, etc.) ---------- */
.segmented {
  display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 3px; gap: 3px; background: var(--surface-2);
}
.segmented button {
  border: none; background: transparent; color: var(--text-secondary);
  padding: 7px 16px; border-radius: calc(var(--radius-sm) - 3px); font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
}
.segmented button.active { background: var(--accent); color: var(--accent-contrast); }
.segmented button:not(.active):hover { color: var(--text); }

/* ---------- Kanban board — Advanced production mode ---------- */
.kanban-board {
  display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px;
  overflow-x: auto; align-items: start;
}
@media (max-width: 900px) {
  .kanban-board { grid-template-columns: repeat(4, 260px); }
}
.kanban-col {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 160px;
}
.kanban-col-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 14px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary);
}
.kanban-count {
  background: var(--surface-hover); color: var(--text-tertiary); border-radius: 999px;
  padding: 1px 8px; font-size: 11px; font-weight: 700;
}
.kanban-col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.kanban-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 13px; font-size: 12.5px; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease;
}
.kanban-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.kanban-card .kc-title { font-weight: 650; font-size: 13px; margin-bottom: 3px; }
.kanban-card .kc-meta { color: var(--text-tertiary); font-size: 11.5px; margin-bottom: 8px; }
.kanban-card .kc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.kanban-empty { color: var(--text-tertiary); font-size: 12px; text-align: center; padding: 18px 8px; }

/* ---------- Item type toggle (Products page: Materials / Finished Goods / Buy & Sell) ---------- */
.type-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; }
.type-badge.material { background: var(--sec-vendors-soft); color: var(--sec-vendors); }
.type-badge.finished { background: var(--sec-products-soft); color: var(--sec-products); }
.type-badge.trade { background: var(--sec-payments-soft); color: var(--sec-payments); }

/* ---------- Profit-by-product margin bar (Dashboard) ---------- */
.margin-track { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 6px 0; max-width: 320px; }
.margin-fill { height: 100%; border-radius: 999px; transition: width 0.2s ease; }

/* ---------- Bill of Materials accordion (bom.html) ---------- */
.bom-accordion { display: flex; flex-direction: column; gap: 12px; }
.bom-card-header {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 20px; background: none; border: none; cursor: pointer;
  text-align: left; font: inherit; color: inherit; border-radius: var(--radius-lg);
}
.bom-card-header:hover { background: var(--surface-hover); }
.bom-card.open .bom-card-header { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.bom-card-chevron { width: 16px; height: 16px; color: var(--text-tertiary); flex-shrink: 0; transition: transform 0.15s ease; }
.bom-card.open .bom-card-chevron { transform: rotate(90deg); color: var(--accent); }
.bom-card-body { padding: 0 20px 20px; border-top: 1px solid var(--border); }
.bom-card-body #bomEditorContainer { padding-top: 16px; }
.bom-card-footer { display: flex; gap: 10px; margin-top: 14px; }

/* ---------- Purchase order attachments (po-editor.html) ---------- */
.attachment-list { display: flex; flex-direction: column; gap: 8px; }
.attachment-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.attachment-thumb {
  width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); color: var(--text-tertiary);
  overflow: hidden;
}
.attachment-thumb img { width: 100%; height: 100%; object-fit: cover; }
.attachment-thumb svg { width: 18px; height: 18px; }

  "use strict";

  var STORAGE_KEY = "app_unlocked_v1";

  function isUnlocked() {
    try { return window.localStorage.getItem(STORAGE_KEY) === "1"; } catch (e) { return false; }
  }
  function markUnlocked() {
    document.documentElement.classList.add("unlocked");
    try { window.localStorage.setItem(STORAGE_KEY, "1"); } catch (e) {}
  }

  function showLockScreen() {
    var overlay = document.createElement("div");
    overlay.className = "lock-screen";
    overlay.innerHTML =
      '<div class="lock-card">' +
        '<div class="lock-mark">&#128274;</div>' +
        "<h1>Enter Access Code</h1>" +
        '<p class="lock-sub">Ask whoever set you up with this app for your access code.</p>' +
        '<input type="password" class="input" id="gateInput" placeholder="Access code" autocomplete="off" />' +
        '<p class="lock-error" id="gateError">That code isn\'t right. Try again.</p>' +
        '<button class="btn btn-primary" id="gateBtn" style="width:100%;justify-content:center;">Unlock</button>' +
      "</div>";
    document.body.appendChild(overlay);

    var input = overlay.querySelector("#gateInput");
    var err = overlay.querySelector("#gateError");

    function attempt() {
      if (input.value === ACCESS_CODE) {
        markUnlocked();
        overlay.remove();
      } else {
        err.classList.add("show");
        input.value = "";
        input.focus();
      }
    }

    overlay.querySelector("#gateBtn").addEventListener("click", attempt);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
    setTimeout(function () { input.focus(); }, 60);
  }

  if (isUnlocked()) {
    document.documentElement.classList.add("unlocked");
  } else {
    document.documentElement.classList.remove("unlocked");
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", showLockScreen);
    } else {
      showLockScreen();
    }
  }
})();

</script>
<script>
/* =========================================================
   Manufacturing & Invoicing Manager — Data Layer
   Plain JavaScript, no build step. All data lives in this
   browser's localStorage. Loaded before every other script.

   This app is the suite's 6th product: one shared catalog of
   raw materials AND finished goods, a Bill of Materials on
   each finished item, a production engine that turns materials
   into finished stock, and customers/invoicing/payments/credit
   notes on top — so a small manufacturer can run the whole
   "buy materials -> make product -> sell product" loop in one
   place instead of stitching together separate tools.
   ========================================================= */

(function (global) {
  "use strict";

  var STORAGE_KEY = "mfg_data_v1";
  var SCHEMA_VERSION = 1;

  var DEFAULT_SETTINGS = {
    businessName: "Your Business",
    logoDataUrl: null,
    email: "",
    phone: "",
    address: "",
    website: "",
    currency: "USD",
    customSymbol: "",
    theme: "dark",
    defaultTaxRate: 0,
    // What to call it on invoices and in Settings — VAT, GST, Sales Tax,
    // HST, whatever the business's own jurisdiction uses. One rate, one
    // name the user writes themselves, rather than a fixed list of presets.
    taxLabel: "Tax",
    paymentInstructions: "Payment due within the terms stated above. Thank you for your business.",
    invoicePrefix: "INV",
    nextInvoiceSeq: 1001,
    poPrefix: "PO",
    nextPoSeq: 3001,
    defaultReorderThreshold: 10,
    // "simple" = one Produce button, atomic, no separate workflow.
    // "advanced" = Work Orders with a Planned/In Progress/Done board.
    // Both modes ultimately call the exact same completeProductionOrder()
    // to touch stock — see the Production section below for why that
    // single-path discipline matters.
    productionMode: "simple",
  };

  function emptyData() {
    return {
      version: SCHEMA_VERSION,
      items: [],
      productionOrders: [],
      customers: [],
      invoices: [],
      payments: [],
      creditNotes: [],
      movements: [],
      vendors: [],
      purchaseOrders: [],
      vendorPayments: [],
      settings: Object.assign({}, DEFAULT_SETTINGS),
    };
  }

  // Attachments (delivery notes, vendor invoices, etc.) live inline on a
  // purchase order's own `attachments` array, stored as base64 data URLs —
  // this app has no server, so "storing a file" means embedding it in the
  // same JSON blob everything else lives in. Capped both per-file and per-
  // order so one enthusiastic upload can't blow the browser's localStorage
  // quota for the whole app; exported as constants so the UI can quote the
  // exact same numbers back to the user rather than hardcoding them twice.
  var ATTACHMENT_MAX_BYTES = 1500000; // 1.5MB, matches the existing logo-upload cap in settings.js
  var ATTACHMENT_MAX_COUNT = 5;

  // ---- in-memory fallback in case localStorage is unavailable
  // (private browsing, disabled storage, etc.)
  var memoryFallback = null;
  // Flips true the moment a write to localStorage fails (quota exceeded,
  // storage disabled, etc.) so the UI can warn the visitor that their
  // latest change only made it into the in-memory fallback above and will
  // be lost on refresh/close unless they export a backup. Flips back to
  // false the next time a write actually succeeds.
  var storageDegraded = false;

  function safeGetItem() {
    try {
      return window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return memoryFallback;
    }
  }
  function safeSetItem(value) {
    try {
      window.localStorage.setItem(STORAGE_KEY, value);
      storageDegraded = false;
    } catch (e) {
      memoryFallback = value;
      storageDegraded = true;
      if (window.MFGUI && window.MFGUI.showStorageBanner) window.MFGUI.showStorageBanner();
    }
  }

  // Live round-trip test — writes a throwaway key, reads it back, cleans
  // up. Unlike storageDegraded (which only flips after a REAL save has
  // already failed), this can be called proactively so a browser that
  // blocks localStorage entirely from the very first page load — some
  // Safari privacy modes do this for a page opened straight from a local
  // file instead of a real web address — gets caught before the visitor
  // has typed anything and lost it. Returns false on ANY failure,
  // including "wrote fine but read back something different."
  function testStorageWritable() {
    var probeKey = "mfg_storage_probe_v1";
    var probeValue = String(Date.now());
    try {
      window.localStorage.setItem(probeKey, probeValue);
      var readBack = window.localStorage.getItem(probeKey);
      window.localStorage.removeItem(probeKey);
      return readBack === probeValue;
    } catch (e) {
      return false;
    }
  }

  function normalize(parsed) {
    var base = emptyData();
    return Object.assign({}, base, parsed, {
      // taxPresets (a list of named quick-pick rates) is retired in favor
      // of one plain taxLabel string — old data that still has a presets
      // array just has it quietly dropped here rather than migrated,
      // since it was a UI convenience list, not a financial record.
      settings: Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {}, {
        taxLabel: (parsed.settings && parsed.settings.taxLabel) || DEFAULT_SETTINGS.taxLabel,
        taxPresets: undefined,
      }),
      items: parsed.items || [],
      productionOrders: parsed.productionOrders || [],
      customers: parsed.customers || [],
      invoices: parsed.invoices || [],
      payments: parsed.payments || [],
      creditNotes: parsed.creditNotes || [],
      movements: parsed.movements || [],
      vendors: parsed.vendors || [],
      // Every purchase order gets a normalized `attachments` array even if
      // it predates this feature (`|| []` on each record, not just the
      // list as a whole), so every other call site can assume the field
      // always exists rather than guarding it individually.
      purchaseOrders: (parsed.purchaseOrders || []).map(function (po) {
        return Object.assign({ attachments: [] }, po, { attachments: po.attachments || [] });
      }),
      vendorPayments: parsed.vendorPayments || [],
    });
  }

  function load() {
    var raw = safeGetItem();
    if (!raw) return emptyData();
    try {
      var parsed = JSON.parse(raw);
      return normalize(parsed);
    } catch (e) {
      console.warn("MFG: could not parse saved data, starting fresh.", e);
      return emptyData();
    }
  }

  var data = load();

  function persist() {
    safeSetItem(JSON.stringify(data));
  }

  // ---------- helpers ----------
  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }
  function nowISO() {
    return new Date().toISOString();
  }
  function todayISO() {
    var d = new Date();
    var tzOffset = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tzOffset).toISOString().slice(0, 10);
  }
  function addDays(iso, days) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function daysBetween(fromISO, toISO) {
    var a = new Date(fromISO + "T00:00:00").getTime();
    var b = new Date(toISO + "T00:00:00").getTime();
    return Math.round((b - a) / 86400000);
  }
  function isPastDue(dueISO) {
    return daysBetween(todayISO(), dueISO) < 0;
  }
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function round2(n) {
    return Math.round((n + Number.EPSILON) * 100) / 100;
  }
  // Display-only: caps a quantity to at most 2 decimal places and drops
  // trailing zeros (5 stays "5", 5.5 stays "5.5", floating-point noise
  // like 5.6699999999999999 becomes "5.67"). Used everywhere a stock,
  // BOM, or line-item quantity is rendered — never on values still being
  // computed with, only at the point of display.
  function formatQty(n) {
    return String(round2(Number(n) || 0));
  }

  // ---------- items (materials + finished goods, one catalog) ----------
  // A single catalog keeps the UI to one Products page (a type filter,
  // not a second whole page to maintain) and means an item that's both
  // bought in bulk and resold in smaller units doesn't need two records.
  // Only "finished" items carry a `bom` (Bill of Materials): an array of
  // {materialId, qtyPerUnit} lines, i.e. how much of each material one
  // unit of this finished item consumes. Only "finished" items carry a
  // sellPrice; only invoiced/sold items need one.
  function findItem(id) {
    return data.items.find(function (x) { return x.id === id; });
  }
  function materialItems() {
    return data.items.filter(function (x) { return x.type === "material"; });
  }
  function finishedItems() {
    return data.items.filter(function (x) { return x.type === "finished"; });
  }
  // "trade" items are bought and resold as-is — no BOM, never produced —
  // but they ARE sellable (like a finished good) and purchasable (like a
  // raw material), so the two lists below decide what can appear on an
  // invoice line and on a purchase order line respectively.
  function tradeItems() {
    return data.items.filter(function (x) { return x.type === "trade"; });
  }
  function sellableItems() {
    return data.items.filter(function (x) { return x.type === "finished" || x.type === "trade"; });
  }
  function purchasableItems() {
    return data.items.filter(function (x) { return x.type === "material" || x.type === "trade"; });
  }
  function addItem(input) {
    var rec = Object.assign({ active: true, bom: [], vendorPrices: [] }, input, { id: uid(), createdAt: nowISO() });
    data.items.push(rec);
    persist();
    return rec;
  }
  function updateItem(id, patch) {
    var it = findItem(id);
    if (!it) return;
    Object.assign(it, patch);
    persist();
  }
  function deleteItem(id) {
    // Items are removed outright, but past production/invoice/movement
    // history that references this item is kept intact (shows as
    // "Deleted item" wherever it's referenced) — same policy as every
    // other app in this suite.
    data.items = data.items.filter(function (x) { return x.id !== id; });
    // Also strip the deleted item from any other finished item's BOM,
    // so a stale materialId never silently breaks a shortage check.
    data.items = data.items.map(function (x) {
      if (!x.bom || !x.bom.length) return x;
      var filtered = x.bom.filter(function (line) { return line.materialId !== id; });
      return filtered.length === x.bom.length ? x : Object.assign({}, x, { bom: filtered });
    });
    persist();
  }

  // ---------- stock movements (materials or finished goods) ----------
  function restock(itemId, quantity, note) {
    var now = nowISO();
    var movement = { id: uid(), itemId: itemId, type: "restock", quantityChange: quantity, reason: note || "Restock", date: todayISO(), createdAt: now };
    data.movements.unshift(movement);
    data.items = data.items.map(function (x) {
      return x.id === itemId ? Object.assign({}, x, { stockQty: x.stockQty + quantity }) : x;
    });
    persist();
  }
  function adjustStock(itemId, quantityChange, reason) {
    var now = nowISO();
    var movement = { id: uid(), itemId: itemId, type: "adjustment", quantityChange: quantityChange, reason: reason, date: todayISO(), createdAt: now };
    data.movements.unshift(movement);
    data.items = data.items.map(function (x) {
      return x.id === itemId ? Object.assign({}, x, { stockQty: Math.max(0, x.stockQty + quantityChange) }) : x;
    });
    persist();
  }

  // ---------- production ----------
  // The one genuinely new engine in this app. Deliberately mirrors the
  // Stock & Invoicing Manager invoice-lifecycle discipline that a real
  // bug (and fix) proved out: stock is mutated in exactly ONE function,
  // completeProductionOrder(), regardless of whether the caller is the
  // Simple mode's single "Produce" button or the Advanced mode's Kanban
  // "Mark Done" action. A production order that can't be completed (not
  // enough materials) is never lost — it just stays in whatever status
  // it was already safely persisted at (planned/in_progress), exactly
  // like a stock-short invoice in Stock & Invoicing Manager stays a
  // saved draft rather than vanishing.
  function bomNeeded(bom, quantity) {
    var needed = {};
    (bom || []).forEach(function (line) {
      needed[line.materialId] = (needed[line.materialId] || 0) + (Number(line.qtyPerUnit) || 0) * quantity;
    });
    return needed;
  }
  function materialShortages(bom, quantity) {
    var needed = bomNeeded(bom, quantity);
    var shortages = [];
    Object.keys(needed).forEach(function (mid) {
      var m = findItem(mid);
      if (!m) return; // deleted material — nothing meaningful to check
      if (m.stockQty < needed[mid]) {
        shortages.push({ materialId: mid, name: m.name, unit: m.unit, needed: round2(needed[mid]), available: m.stockQty });
      }
    });
    return shortages;
  }
  function findProductionOrder(id) {
    return data.productionOrders.find(function (x) { return x.id === id; });
  }
  function createProductionOrder(itemId, quantity, note) {
    var item = findItem(itemId);
    if (!item || item.type !== "finished") return { ok: false, error: "Pick a finished-good item to produce." };
    if (!quantity || quantity <= 0) return { ok: false, error: "Quantity must be greater than zero." };
    var rec = {
      id: uid(),
      itemId: itemId,
      quantity: quantity,
      note: note || "",
      status: "planned",
      materialsUsed: null,
      createdAt: nowISO(),
      startedAt: null,
      completedAt: null,
      updatedAt: nowISO(),
    };
    data.productionOrders.unshift(rec);
    persist();
    return { ok: true, order: rec };
  }
  function startProductionOrder(id) {
    var order = findProductionOrder(id);
    if (!order) return { ok: false, error: "Production order not found." };
    if (order.status !== "planned") return { ok: false, error: "Only planned orders can be started." };
    order.status = "in_progress";
    order.startedAt = nowISO();
    order.updatedAt = nowISO();
    persist();
    return { ok: true, order: order };
  }
  // The single stock-mutating step: checks the finished item's BOM x
  // quantity against current material stock, and only if every material
  // has enough does it atomically deduct materials and add finished
  // stock, logging one movement per material plus one for the finished
  // item. Works from "planned" or "in_progress" (Simple mode never calls
  // startProductionOrder at all — it goes straight from planned to done).
  function completeProductionOrder(id) {
    var order = findProductionOrder(id);
    if (!order) return { ok: false, error: "Production order not found." };
    if (order.status !== "planned" && order.status !== "in_progress") {
      return { ok: false, error: "Only planned or in-progress orders can be completed." };
    }
    var item = findItem(order.itemId);
    if (!item) return { ok: false, error: "The item being produced no longer exists." };
    var shortages = materialShortages(item.bom, order.quantity);
    if (shortages.length) return { ok: false, shortages: shortages };

    var now = nowISO();
    var needed = bomNeeded(item.bom, order.quantity);
    var usedSnapshot = [];
    var newMovements = [];
    Object.keys(needed).forEach(function (mid) {
      var m = findItem(mid);
      var qty = round2(needed[mid]);
      usedSnapshot.push({ materialId: mid, name: m ? m.name : "Deleted item", qty: qty });
      newMovements.push({ id: uid(), itemId: mid, type: "production-consume", quantityChange: -qty, reason: "Production " + order.id.slice(0, 8), date: todayISO(), productionOrderId: order.id, createdAt: now });
    });
    newMovements.push({ id: uid(), itemId: item.id, type: "production-output", quantityChange: order.quantity, reason: "Production " + order.id.slice(0, 8), date: todayISO(), productionOrderId: order.id, createdAt: now });

    data.movements = newMovements.concat(data.movements);
    data.items = data.items.map(function (x) {
      var m = newMovements.find(function (mv) { return mv.itemId === x.id; });
      return m ? Object.assign({}, x, { stockQty: Math.max(0, x.stockQty + m.quantityChange) }) : x;
    });

    order.status = "done";
    order.materialsUsed = usedSnapshot;
    order.completedAt = now;
    order.updatedAt = now;
    persist();
    return { ok: true, order: order };
  }
  // Convenience for Simple mode: create + complete in one call. If
  // completion fails on a shortage, the order is still safely sitting
  // as "planned" — nothing is lost, and Advanced mode's queue will show
  // it waiting for materials, so switching modes never strands data.
  function produceSimple(itemId, quantity, note) {
    var created = createProductionOrder(itemId, quantity, note);
    if (!created.ok) return created;
    var completed = completeProductionOrder(created.order.id);
    if (!completed.ok) return Object.assign({}, completed, { order: created.order });
    return completed;
  }
  function cancelProductionOrder(id) {
    var order = findProductionOrder(id);
    if (!order) return;
    if (order.status !== "planned" && order.status !== "in_progress") return;
    order.status = "cancelled";
    order.updatedAt = nowISO();
    persist();
  }
  // Reverses a completed order's stock impact (restores materials from
  // the saved snapshot, removes the finished-good quantity, floored at
  // 0 defensively) before removing the record — mirrors how deleting a
  // sent invoice restores the stock it deducted elsewhere in this suite.
  function deleteProductionOrder(id) {
    var order = findProductionOrder(id);
    if (!order) return;
    if (order.status === "done" && order.materialsUsed) {
      var now = nowISO();
      var reverseMovements = order.materialsUsed.map(function (u) {
        return { id: uid(), itemId: u.materialId, type: "production-deleted", quantityChange: u.qty, reason: "Production order deleted", date: todayISO(), productionOrderId: order.id, createdAt: now };
      });
      reverseMovements.push({ id: uid(), itemId: order.itemId, type: "production-deleted", quantityChange: -order.quantity, reason: "Production order deleted", date: todayISO(), productionOrderId: order.id, createdAt: now });
      data.movements = reverseMovements.concat(data.movements);
      data.items = data.items.map(function (x) {
        var m = reverseMovements.find(function (mv) { return mv.itemId === x.id; });
        return m ? Object.assign({}, x, { stockQty: Math.max(0, x.stockQty + m.quantityChange) }) : x;
      });
    }
    data.productionOrders = data.productionOrders.filter(function (x) { return x.id !== id; });
    persist();
  }

  // ---------- invoice calculations ----------
  function lineTotal(item) {
    return round2((item.quantity || 0) * (item.rate || 0));
  }
  function subtotal(items) {
    return round2((items || []).reduce(function (sum, it) { return sum + lineTotal(it); }, 0));
  }
  function discountAmount(sub, discountType, discountValue) {
    if (!discountValue) return 0;
    if (discountType === "percent") return round2((sub * discountValue) / 100);
    return round2(Math.min(discountValue, sub));
  }
  function taxAmount(taxableBase, taxRate) {
    return round2((taxableBase * (taxRate || 0)) / 100);
  }
  function computeTotals(invoice) {
    var sub = subtotal(invoice.items);
    var disc = discountAmount(sub, invoice.discountType, invoice.discountValue);
    var taxable = Math.max(0, round2(sub - disc));
    var tax = taxAmount(taxable, invoice.taxRate);
    var total = round2(taxable + tax);
    return { subtotal: sub, discount: disc, taxable: taxable, tax: tax, total: total };
  }
  function amountPaid(invoiceId, payments) {
    return round2(
      (payments || []).filter(function (p) { return p.invoiceId === invoiceId; }).reduce(function (sum, p) { return sum + p.amount; }, 0)
    );
  }
  // Sums every credit-note application against this invoice, across all
  // credit notes (a customer can apply more than one credit note to the
  // same invoice, and one credit note can be split across invoices).
  function creditAppliedForInvoice(invoiceId, creditNotes) {
    var total = 0;
    (creditNotes || []).forEach(function (cn) {
      (cn.applications || []).forEach(function (a) {
        if (a.invoiceId === invoiceId) total += a.amount;
      });
    });
    return round2(total);
  }
  // `settled` = payments + credit applied. A credit note is a separate
  // transaction from a payment (matches QuickBooks/Xero/Zoho Invoice —
  // researched before building this), but for the purpose of "is this
  // invoice paid off", both count toward closing the balance.
  function derivedStatus(invoice, settled, total) {
    if (invoice.status === "cancelled") return "cancelled";
    if (invoice.status === "draft") return "draft";
    if (settled >= total && total > 0) return "paid";
    if (invoice.status === "sent" && isPastDue(invoice.dueDate) && settled < total) return "overdue";
    if (settled > 0 && settled < total) return "partial";
    return "sent";
  }
  function buildInvoiceRow(invoice, payments, creditNotes) {
    var totals = computeTotals(invoice);
    var paid = amountPaid(invoice.id, payments);
    var creditApplied = creditAppliedForInvoice(invoice.id, creditNotes);
    var settled = round2(paid + creditApplied);
    var balance = round2(totals.total - settled);
    var status = derivedStatus(invoice, settled, totals.total);
    return { invoice: invoice, total: totals.total, paid: paid, creditApplied: creditApplied, balance: balance, status: status };
  }
  function buildInvoiceRows(invoices, payments, creditNotes) {
    return (invoices || []).map(function (inv) { return buildInvoiceRow(inv, payments, creditNotes); });
  }

  // Sums requested quantity per finished item across an invoice's line
  // items and reports any item that doesn't have enough stock on hand.
  // Lines with no itemId (a free-text/service line) never touch stock.
  function stockShortagesForInvoice(items) {
    var needed = {};
    (items || []).forEach(function (it) {
      if (!it.productId) return;
      needed[it.productId] = (needed[it.productId] || 0) + (Number(it.quantity) || 0);
    });
    var shortages = [];
    Object.keys(needed).forEach(function (pid) {
      var it = findItem(pid);
      if (!it) return;
      if (it.stockQty < needed[pid]) {
        shortages.push({ productId: pid, name: it.name, unit: it.unit, needed: needed[pid], available: it.stockQty });
      }
    });
    return shortages;
  }
  function applyStockForInvoice(invoice, sign, reasonPrefix) {
    var now = nowISO();
    var byItem = {};
    (invoice.items || []).forEach(function (it) {
      if (!it.productId) return;
      byItem[it.productId] = (byItem[it.productId] || 0) + (Number(it.quantity) || 0);
    });
    var ids = Object.keys(byItem);
    if (!ids.length) return;
    var label = reasonPrefix + " " + (invoice.number || invoice.id.slice(0, 8));
    var newMovements = ids.map(function (pid) {
      return { id: uid(), itemId: pid, type: "invoice", quantityChange: sign * byItem[pid], reason: label, date: todayISO(), invoiceId: invoice.id, createdAt: now };
    });
    data.movements = newMovements.concat(data.movements);
    data.items = data.items.map(function (x) {
      var m = newMovements.find(function (mv) { return mv.itemId === x.id; });
      return m ? Object.assign({}, x, { stockQty: Math.max(0, x.stockQty + m.quantityChange) }) : x;
    });
  }

  // ---------- customers ----------
  function addCustomer(input) {

    persist();
    return rec;

  // ---------- purchase orders ----------
  // Mirrors the invoice Draft -> Sent lifecycle, but the stock-touching
  // moment is different: sending a purchase order never touches stock by
  // itself (nothing has physically arrived yet) — only receivePurchaseOrder
  // does, and it can be called more than once as a shipment arrives in
  // parts, going draft -> sent -> partial -> received. Cancelling is safe
  // at any point before anything has been received, since no stock has
  // moved yet; once any line has a receivedQty, the order can no longer be
  // deleted outright (it's real inventory history) but can still be
  // cancelled to close out the remainder.

    var s = data.settings;

    var payload = Object.assign({}, patch);
    if (payload.items) payload.items = payload.items.map(function (l) { return Object.assign({ receivedQty: 0 }, l); });
    Object.assign(po, payload, { updatedAt: nowISO() });

  }

    // recorded against it with it, so block the delete instead and point

    var anyPaid = (data.vendorPayments || []).some(function (p) { return p.purchaseOrderId === id; });

    data.vendorPayments.unshift(rec);
    persist();
    return rec;
  }

    persist();
  }

    }
    var now = nowISO();
    var s = data.settings;
    var number = input.number || (s.invoicePrefix + "-" + s.nextInvoiceSeq);
    var bumpSeq = !input.number;
    var rec = Object.assign({}, input, {
      number: number,
      id: uid(),
      stockApplied: false,
      createdAt: now,
      updatedAt: now,
    });

  // ---------- credit notes ----------
  // Standalone (not required to reference any invoice at creation) —

          '<div class="brand"><div class="brand-mark">M</div><div class="brand-text"><div class="brand-title">Manufacturing &amp; Invoicing</div><div class="brand-sub">Make it, stock it, sell it</div></div></div>' +
          '<nav class="nav">' + navHtml + "</nav>" +
          '<div class="sidebar-footer">Build ' + BUILD_DATE + " · Local data only</div>" +
        "</aside>" +
        '<div class="main">' +
          '<header class="topbar">' +
            '<div class="topbar-heading" ' + sectionColorStyle(activeItem.key) + '>' +
              '<div class="page-icon-chip">' + activeItem.icon + "</div>" +
              '<div><h1 id="pageTitle"></h1><p class="sub" id="pageSub"></p></div>' +
            "</div>" +
            '<div class="topbar-actions" id="topbarActions"></div>' +
          "</header>" +
          '<div class="content" id="pageContent"></div>' +
        "</div>" +
      "</div>";

    var root = document.getElementById("app-shell");
    root.innerHTML = shellHtml;

    var menuBtn = document.getElementById("mobileMenuBtn");
    var backdrop = document.getElementById("sidebarBackdrop");
    function closeMenu() { document.body.classList.remove("sidebar-open"); }
    if (menuBtn) menuBtn.addEventListener("click", function () { document.body.classList.toggle("sidebar-open"); });
    if (backdrop) backdrop.addEventListener("click", closeMenu);
    document.querySelectorAll(".nav-link").forEach(function (a) { a.addEventListener("click", closeMenu); });

    // A prior write to localStorage may have already failed (e.g. this
    // navigation itself was the write that hit a full/blocked storage) —
    // rebuild the shell already knowing that, rather than waiting for the
    // next persist() to notice.
    if (MFG.isStorageDegraded()) showStorageBanner();

    return {
      contentEl: document.getElementById("pageContent"),
      setTitle: function (title, sub) {
        document.getElementById("pageTitle").textContent = title;
        document.getElementById("pageSub").textContent = sub || "";
      },
      setActions: function (html) {
        document.getElementById("topbarActions").innerHTML = html;
      },
    };
  }

  // ---------- storage-degraded banner ----------
  // Shown when a write to localStorage has failed (store.js's
  // safeSetItem calls showStorageBanner() from its catch block) so the
  // change silently only landed in the in-memory fallback and would be
  // lost on refresh/close. Sticky and hard to miss on purpose.
  function showStorageBanner() {
    var bannerEl = document.getElementById("storageBanner");
    if (bannerEl) bannerEl.classList.remove("hidden");
  }
  function hideStorageBanner() {
    var bannerEl = document.getElementById("storageBanner");
    if (bannerEl) bannerEl.classList.add("hidden");
  }

  // ---------- toast ----------
  function toast(message, tone) {
    var root = document.getElementById("toast-root");
    if (!root) return;
    var node = el('<div class="toast ' + (tone || "") + '">' + escapeHtml(message) + "</div>");
    root.appendChild(node);
    setTimeout(function () {
      node.style.transition = "opacity 0.25s ease";
      node.style.opacity = "0";
      setTimeout(function () { node.remove(); }, 250);
    }, 2600);
  }

  // ---------- modal ----------
  function openModal(opts) {
    var root = document.getElementById("modal-root");
    var backdrop = el(
      '<div class="modal-backdrop">' +
        '<div class="modal" role="dialog" aria-modal="true"' + (opts.wide ? ' style="max-width:640px;"' : "") + '>' +
          '<div class="modal-header"><h3>' + escapeHtml(opts.title) + '</h3><button class="btn-icon neutral" id="modalCloseBtn" aria-label="Close">' + ICONS.close + "</button></div>" +
          '<div class="modal-body" id="modalBody"></div>' +
          '<div class="modal-footer" id="modalFooter"></div>' +
        "</div>" +
      "</div>"
    );
    root.appendChild(backdrop);
    var bodyEl = backdrop.querySelector("#modalBody");
    var footerEl = backdrop.querySelector("#modalFooter");
    if (opts.body instanceof Node) bodyEl.appendChild(opts.body);
    else bodyEl.innerHTML = opts.body || "";
    if (opts.footer instanceof Node) footerEl.appendChild(opts.footer);
    else footerEl.innerHTML = opts.footer || "";

    function close() { backdrop.remove(); }
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });
    backdrop.querySelector("#modalCloseBtn").addEventListener("click", close);

    if (opts.onMount) opts.onMount(backdrop, close);
    return { close: close, el: backdrop };
  }

  function confirmDialog(opts) {
    openModal({
      title: opts.title,
      body: '<p class="text-secondary">' + escapeHtml(opts.description) + "</p>",
      footer:
        '<button class="btn btn-ghost" id="cdCancel">Cancel</button>' +
        '<button class="btn ' + (opts.dangerless ? "btn-primary" : "btn-danger") + '" id="cdConfirm">' + escapeHtml(opts.confirmLabel || "Delete") + "</button>",
      onMount: function (root, close) {
        root.querySelector("#cdCancel").addEventListener("click", close);
        root.querySelector("#cdConfirm").addEventListener("click", function () {
          close();
          opts.onConfirm();
        });
      },
    });
  }

  // ---------- small helpers ----------
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var STATUS_LABELS = { draft: "Draft", sent: "Sent", partial: "Partial", paid: "Paid", overdue: "Overdue", cancelled: "Cancelled" };
  var STATUS_PILL_CLASS = { draft: "pill-neutral", sent: "pill-accent", partial: "pill-warning", paid: "pill-success", overdue: "pill-danger", cancelled: "pill-neutral" };
  function statusBadge(status) {
    var cls = STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  var PO_STATUS_LABELS = { planned: "Planned", in_progress: "In Progress", done: "Done", cancelled: "Cancelled" };
  var PO_STATUS_PILL_CLASS = { planned: "pill-neutral", in_progress: "pill-warning", done: "pill-success", cancelled: "pill-neutral" };
  function productionStatusBadge(status) {
    var cls = PO_STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = PO_STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  // Named PURCHASE_* (not PO_*) to avoid colliding with the Production
  // Order status constants directly above — "PO" already means Production
  // Order everywhere else in this file, so a real Purchase Order needed
  // its own, unambiguous name.
  var PURCHASE_STATUS_LABELS = { draft: "Draft", sent: "Sent", partial: "Partially Received", received: "Received", cancelled: "Cancelled" };
  var PURCHASE_STATUS_PILL_CLASS = { draft: "pill-neutral", sent: "pill-accent", partial: "pill-warning", received: "pill-success", cancelled: "pill-neutral" };
  function purchaseOrderStatusBadge(status) {
    var cls = PURCHASE_STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = PURCHASE_STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  // Accounts-payable status for a purchase order — distinct from
  // purchaseOrderStatusBadge above, which tracks physical receiving
  // progress (draft/sent/partial/received). This tracks money instead:
  // whether the vendor has been paid, independent of how much has arrived.
  var PAY_STATUS_LABELS = { unpaid: "Unpaid", partial: "Partially Paid", paid: "Paid", "n/a": "—" };
  var PAY_STATUS_PILL_CLASS = { unpaid: "pill-danger", partial: "pill-warning", paid: "pill-success", "n/a": "pill-neutral" };
  function paymentStatusBadge(status) {
    var cls = PAY_STATUS_PILL_CLASS[status] || "pill-neutral";
    var label = PAY_STATUS_LABELS[status] || status;
    return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
  }

  // ---------- vendor payment modal (shared by po-editor.js and accounts-payable.js) ----------
  // Mirrors the invoice editor's own openPaymentModal exactly (same fields,
  // same method list, same "amount pre-filled with the balance due"
  // pattern) so recording money in either direction feels identical.
  function openVendorPaymentModal(po, onSaved) {
    var balance = MFG.poBalanceDue(po);
    var body =
      '<p class="text-tertiary" style="font-size:12px;">Balance due: <strong style="color:var(--text);">' + MFG.formatCurrency(balance, po.currency) + "</strong></p>" +
      '<div class="field"><label>Amount<span class="req">*</span></label><input class="input" type="number" min="0" step="any" id="vpAmount" value="' + balance + '"/>' +
      '<span class="error hidden" id="vpAmountErr">Enter an amount greater than zero.</span></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Date</label><input class="input" type="date" id="vpDate" value="' + MFG.todayISO() + '"/></div>' +
        '<div class="field"><label>Method</label><select class="input" id="vpMethod">' +
          ["Bank Transfer", "Credit Card", "Cash", "Check", "PayPal", "Other"].map(function (m) { return '<option value="' + m + '">' + m + "</option>"; }).join("") +
        "</select></div>" +
      "</div>" +
      '<div class="field"><label>Note</label><textarea class="input" id="vpNote" rows="2" placeholder="Optional reference number, etc."></textarea></div>';

    openModal({
      title: "Record Payment — " + po.number,
      body: body,
      footer: '<button class="btn btn-ghost" id="cancelModalBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Record Payment</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelModalBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var amount = Number(root.querySelector("#vpAmount").value);
          if (!amount || amount <= 0) {
            root.querySelector("#vpAmount").classList.add("has-error");
            root.querySelector("#vpAmountErr").classList.remove("hidden");
            return;
          }
          MFG.recordVendorPayment({
            purchaseOrderId: po.id,
            amount: amount,
            date: root.querySelector("#vpDate").value || MFG.todayISO(),
