            method: root.querySelector("#vpMethod").value,
            note: root.querySelector("#vpNote").value.trim() || undefined,
          });
          toast("Payment recorded.");
          close();
          if (onSaved) onSaved();
        });
      },
    });
  }

  function emptyState(iconKey, title, desc, actionHtml) {
    return (
      '<div class="empty"><div class="icon-wrap">' + (ICONS[iconKey] || "") + "</div>" +
      "<h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(desc) + "</p>" +
      (actionHtml ? '<div class="mt-2">' + actionHtml + "</div>" : "") +
      "</div>"
    );
  }

  // ---------- shared catalog picker modal ----------
  // A searchable, properly-aligned list to choose from instead of a
  // native <select> full of "name (sku) — price, stock" crammed onto one
  // unbreakable line — used by the invoice/PO line item editors (to pick
  // a product or material for a row) and the BOM editor (to pick a
  // material for a line), so all three get the same easier picking flow.
  //
  // opts:
  //   title, searchPlaceholder, emptyText
  //   entries: [{ id, name, meta }]         — meta is a small secondary line (price, stock, etc.)
  //   showQty: bool                          — show a quantity field per row (used when a pick creates
  //                                             a brand-new line, so quantity is set in the same step)
  //   qtyDefault: number
  //   closeAfterPick: bool                   — true for "swap this row's item" (one pick, modal closes);
  //                                             false for "add from catalog" (stays open, add several, then Done)
  //   onPick: function(id, qty)
  function openCatalogPickerModal(opts) {
    var query = "";
    var picked = {};

    function rowHtml(e) {
      var qtyHtml = opts.showQty
        ? '<div class="picker-row-qty"><input class="input" type="number" min="0" step="any" value="' + (opts.qtyDefault || 1) + '" data-qty="' + e.id + '" aria-label="' + escapeHtml(opts.qtyLabel || "Quantity") + '" title="' + escapeHtml(opts.qtyLabel || "Quantity") + '"/></div>'
        : "";
      return (
        '<div class="picker-row' + (picked[e.id] ? " picked" : "") + '" data-entry="' + e.id + '">' +
          '<div class="picker-row-info"><p class="name">' + escapeHtml(e.name) + '</p>' + (e.meta ? '<p class="meta">' + escapeHtml(e.meta) + "</p>" : "") + "</div>" +
          qtyHtml +
          '<button type="button" class="btn btn-secondary btn-sm" data-use="' + e.id + '">' + (picked[e.id] ? "Added" : (opts.showQty ? "Add" : "Use")) + "</button>" +
        "</div>"
      );
    }

    function listHtml() {
      var q = query.trim().toLowerCase();
      var filtered = !q ? opts.entries : opts.entries.filter(function (e) {
        return (e.name + " " + (e.meta || "")).toLowerCase().indexOf(q) !== -1;
      });
      if (!filtered.length) return '<p class="picker-empty">' + escapeHtml(opts.emptyText || "No matches.") + "</p>";
      return '<div class="picker-list">' + filtered.map(rowHtml).join("") + "</div>";
    }

    var body =
      '<div class="field picker-search"><input class="input" id="pickerSearch" placeholder="' + escapeHtml(opts.searchPlaceholder || "Search…") + '" autocomplete="off"/></div>' +
      (opts.showQty ? '<p class="text-tertiary" style="font-size:11.5px;margin:-6px 0 10px;">Set ' + escapeHtml((opts.qtyLabel || "quantity").toLowerCase()) + ', then Add. Keep going — everything you add stays in this list until you\'re done.</p>' : "") +
      '<div id="pickerListWrap">' + listHtml() + "</div>";

    return openModal({
      title: opts.title,
      wide: true,
      body: body,
      footer: opts.showQty ? '<button class="btn btn-primary" id="pickerDoneBtn">Done</button>' : '<button class="btn btn-ghost" id="pickerCancelBtn">Cancel</button>',
      onMount: function (root, close) {
        function bindRows() {
          root.querySelectorAll("[data-use]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var id = btn.getAttribute("data-use");
              var qty = 1;
              if (opts.showQty) {
                var qtyInput = root.querySelector('[data-qty="' + id + '"]');
                qty = qtyInput ? (Number(qtyInput.value) || 0) : 1;
                if (qty <= 0) { if (qtyInput) qtyInput.focus(); return; }
              }
              opts.onPick(id, qty);
              if (opts.closeAfterPick) { close(); return; }
              picked[id] = true;
              var rowEl = root.querySelector('[data-entry="' + id + '"]');
              if (rowEl) {
                rowEl.classList.add("picked");
                var useBtn = rowEl.querySelector("[data-use]");
                if (useBtn) useBtn.textContent = "Added";
              }
            });
          });
        }
        bindRows();
        var searchInput = root.querySelector("#pickerSearch");
        searchInput.focus();
        searchInput.addEventListener("input", function () {
          query = searchInput.value;
          root.querySelector("#pickerListWrap").innerHTML = listHtml();
          bindRows();
        });
        var cancelBtn = root.querySelector("#pickerCancelBtn");
        if (cancelBtn) cancelBtn.addEventListener("click", close);
        var doneBtn = root.querySelector("#pickerDoneBtn");
        if (doneBtn) doneBtn.addEventListener("click", close);
      },
    });
  }

  // ---------- item-aware line items editor (invoice line items) ----------
  // Each row can optionally be tied to a catalog item (data-field
  // "productId") — picking one auto-fills description + rate from that
  // item's sell price and shows how much finished stock is on hand, but
  // both description and rate stay directly editable afterward. Leaving
  // the picker on "— custom line —" makes it a plain service/fee line
  // that never touches stock. `readOnly` renders a static, non-
  // interactive summary instead (used once an invoice has been sent).
  function createLineItemsEditor(container, items, currency, products, readOnly, getPriceForItem) {
    var state = {
      items: (items && items.length ? items : [{ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 }]).map(function (it) {
        return Object.assign({}, it);
      }),
      currency: currency,
      onChange: null,
    };

    // Selectable options only ever come from active items, and `products`
    // is fixed for the life of this editor instance — so the eligible
    // list is filtered once here, not re-filtered from the full catalog
    // inside productOptionsHtml on every row's render.
    var activeProducts = (products || []).filter(function (p) { return p.active; });

    function amountText(it) {
      return MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.rate || 0)), state.currency);
    }

    function catalogEntries() {
      return activeProducts.map(function (p) {
        return { id: p.id, name: p.name + " (" + p.sku + ")", meta: MFG.formatCurrency(p.sellPrice, state.currency) + " · " + MFG.formatQty(p.stockQty) + " in stock" };
      });
    }

    function chosenLabel(it) {
      if (!it.productId) return "Choose item";
      var p = (products || []).find(function (x) { return x.id === it.productId; });
      return p ? p.name : "Item deleted";
    }

    function applyProductPick(it, pid) {
      it.productId = pid;
      var p = (products || []).find(function (x) { return x.id === pid; });
      if (p) {
        it.description = p.name;
        it.rate = (typeof getPriceForItem === "function") ? getPriceForItem(pid, p.sellPrice) : p.sellPrice;
      }
    }

    // Looks up against the full (not active-filtered) product list, since
    // a line item saved against a product that's since been deactivated
    // should still show its real stock hint here, not "Item deleted".
    function stockHint(it) {
      if (!it.productId) return "";
      var p = (products || []).find(function (x) { return x.id === it.productId; });
      if (!p) return '<span class="line-item-stock-hint" style="color:var(--danger);">Item deleted</span>';
      var short = p.stockQty < (Number(it.quantity) || 0);
      return '<span class="line-item-stock-hint"' + (short ? ' style="color:var(--danger);"' : "") + ">" + MFG.formatQty(p.stockQty) + " in stock" + (short ? " — not enough" : "") + "</span>";
    }

    // Wraps one field's label + control so the mobile breakpoint below
    // ~700px (see .line-item-field in styles.css) can show the label
    // above the control when the row reflows from a grid into a stacked
    // card. On wider screens the label stays hidden and the wrapper is
    // just another grid column, so desktop layout is unaffected.
    function fieldWrapper(labelText, innerHtml) {
      return '<div class="line-item-field"><span class="line-item-field-label">' + escapeHtml(labelText) + "</span>" + innerHtml + "</div>";
    }

    function rowHtml(it) {
      if (readOnly) {
        return (
          '<div class="line-item-row line-item-row-readonly" data-row="' + it.id + '">' +
            fieldWrapper("Description", escapeHtml(it.description || "—") + (it.productId ? '<div class="line-item-stock-hint">' + stockHint(it) + "</div>" : "")) +
            fieldWrapper("Qty", MFG.formatQty(it.quantity)) +
            fieldWrapper("Rate", MFG.formatCurrency(it.rate, state.currency)) +
            '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
            "<div></div>" +
          "</div>"
        );
      }
      return (
        '<div class="line-item-row line-item-row-editable" data-row="' + it.id + '">' +
          fieldWrapper("Item",
            '<div style="display:flex;align-items:center;gap:2px;">' +
              '<button type="button" class="line-item-choose-btn' + (it.productId ? " has-item" : "") + '" data-choose="' + it.id + '" title="Choose from product catalog">' + ICONS.search + "<span>" + escapeHtml(chosenLabel(it)) + "</span></button>" +
              (it.productId ? '<button type="button" class="btn-icon neutral" data-clear-item="' + it.id + '" aria-label="Clear item" title="Clear item — make this a custom line">' + ICONS.close + "</button>" : "") +
            "</div>"
          ) +
          fieldWrapper("Description",
            '<input class="input" data-field="description" value="' + escapeHtml(it.description || "") + '" placeholder="Item or service description" aria-label="Item description"/>' +
            (it.productId ? '<div class="line-item-stock-hint" data-stockhint>' + stockHint(it) + "</div>" : "")
          ) +
          fieldWrapper("Qty", '<input class="input" type="number" min="0" step="any" data-field="quantity" value="' + it.quantity + '" aria-label="Quantity"/>') +
          fieldWrapper("Rate", '<input class="input" type="number" min="0" step="any" data-field="rate" value="' + it.rate + '" aria-label="Rate"/>') +
          '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove line item"' + (state.items.length === 1 ? " disabled" : "") + ">" + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      var headCols = readOnly
        ? '<div class="line-items-head line-items-head-readonly"><span>Description</span><span>Qty</span><span>Rate</span><span style="text-align:right;">Amount</span><span></span></div>'
        : '<div class="line-items-head line-items-head-editable"><span>Item</span><span>Description</span><span>Qty</span><span>Rate</span><span style="text-align:right;">Amount</span><span></span></div>';
      container.innerHTML =
        '<div class="line-items' + (readOnly ? " line-items-readonly" : "") + '">' +
          headCols +
          state.items.map(rowHtml).join("") +
          (readOnly ? "" :
            '<div class="line-items-footer">' +
              '<button type="button" class="add-line-btn primary" id="chooseCatalogBtn">' + ICONS.packagePlus + " Choose from catalog</button>" +
              '<button type="button" class="add-line-btn" id="addLineBtn">' + ICONS.plus + " Add custom line</button>" +
            "</div>"
          ) +
        "</div>";
      if (!readOnly) bind();
    }

    function bind() {
      container.querySelectorAll("[data-row]").forEach(function (rowEl) {
        var id = rowEl.getAttribute("data-row");
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          input.addEventListener("input", function () {
            var field = input.getAttribute("data-field");
            var it = state.items.find(function (x) { return x.id === id; });
            if (!it) return;
            if (field === "description") {
              it.description = input.value;
            } else {
              it[field] = Number(input.value) || 0;
            }
            var amountEl = rowEl.querySelector(".line-item-amount-value");
            if (amountEl) amountEl.textContent = amountText(it);
            var hintEl = rowEl.querySelector("[data-stockhint]");
            if (hintEl) hintEl.innerHTML = stockHint(it);
            if (state.onChange) state.onChange(state.items);
          });
        });
        var chooseBtn = rowEl.querySelector("[data-choose]");
        if (chooseBtn) {
          chooseBtn.addEventListener("click", function () {
            openCatalogPickerModal({
              title: "Choose an item",
              searchPlaceholder: "Search products…",
              emptyText: "No active products yet — add one on the Products page, or just type a description below for a custom line.",
              entries: catalogEntries(),
              showQty: false,
              closeAfterPick: true,
              onPick: function (pid) {
                var it = state.items.find(function (x) { return x.id === id; });
                if (!it) return;
                applyProductPick(it, pid);
                render();
                if (state.onChange) state.onChange(state.items);
              },
            });
          });
        }
        var clearBtn = rowEl.querySelector("[data-clear-item]");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            var it = state.items.find(function (x) { return x.id === id; });
            if (!it) return;
            it.productId = null;
            render();
            if (state.onChange) state.onChange(state.items);
          });
        }
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) {
          removeBtn.addEventListener("click", function () {
            if (state.items.length === 1) return;
            state.items = state.items.filter(function (x) { return x.id !== id; });
            render();
            if (state.onChange) state.onChange(state.items);
          });
        }
      });
      var chooseCatalogBtn = container.querySelector("#chooseCatalogBtn");
      if (chooseCatalogBtn) {
        chooseCatalogBtn.addEventListener("click", function () {
          openCatalogPickerModal({
            title: "Add items from catalog",
            searchPlaceholder: "Search products…",
            emptyText: "No active products yet — add one on the Products page first.",
            entries: catalogEntries(),
            showQty: true,
            qtyLabel: "Qty",
            qtyDefault: 1,
            closeAfterPick: false,
            onPick: function (pid, qty) {
              var p = (products || []).find(function (x) { return x.id === pid; });
              var newItem = { id: MFG.uid(), productId: pid, description: p ? p.name : "", quantity: qty, rate: 0 };
              applyProductPick(newItem, pid);
              newItem.quantity = qty;
              // A still-untouched blank starter row gets replaced instead of
              // leaving an empty line sitting above the items just picked.
              if (state.items.length === 1 && !state.items[0].productId && !state.items[0].description && !state.items[0].rate) {
                state.items[0] = newItem;
              } else {
                state.items.push(newItem);
              }
              render();
              if (state.onChange) state.onChange(state.items);
            },
          });
        });
      }
      var addBtn = container.querySelector("#addLineBtn");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          state.items.push({ id: MFG.uid(), productId: null, description: "", quantity: 1, rate: 0 });
          render();
          if (state.onChange) state.onChange(state.items);
        });
      }
    }

    render();

    return {
      getItems: function () { return state.items; },
      setCurrency: function (c) { state.currency = c; render(); },
      onChange: function (fn) { state.onChange = fn; },
    };
  }

  // ---------- BOM (Bill of Materials) editor ----------
  // Used on the Products page when editing a finished-good item: a list
  // of {materialId, qtyPerUnit} rows against the material catalog. Kept
  // as its own small component (distinct from the invoice line items
  // editor above) since it edits a totally different shape of data —
  // "how much of X does one unit of this product need," not a sellable
  // line with its own price.
  function createBomEditor(container, bomLines, materials) {
    var state = {
      lines: (bomLines || []).map(function (l) { return Object.assign({}, l); }),
      onChange: null,
    };

    // `materials` is fixed for the life of this editor instance (one
    // modal-open), so the active-material list backing every row's
    // <select> is filtered once here rather than re-filtered from the
    // full catalog inside materialOptionsHtml on every line's render.
    var activeMaterials = (materials || []).filter(function (m) { return m.active; });

    function catalogEntries() {
      return activeMaterials.map(function (m) {
        return { id: m.id, name: m.name + " (" + m.sku + ")", meta: MFG.formatCurrency(m.costPrice) + "/" + m.unit + " · " + MFG.formatQty(m.stockQty) + " " + m.unit + " in stock" };
      });
    }

    function chosenLabel(materialId) {
      if (!materialId) return "Choose material";
      var m = (materials || []).find(function (x) { return x.id === materialId; });
      return m ? m.name : "Material deleted";
    }

    function estimatedCost() {
      return state.lines.reduce(function (sum, l) {
        var m = (materials || []).find(function (x) { return x.id === l.materialId; });
        return sum + (m ? m.costPrice * (Number(l.qtyPerUnit) || 0) : 0);
      }, 0);
    }

    function rowHtml(line, idx) {
      return (
        '<div class="bom-row" data-idx="' + idx + '">' +
          '<div style="display:flex;align-items:center;gap:2px;">' +
            '<button type="button" class="line-item-choose-btn' + (line.materialId ? " has-item" : "") + '" data-choose="' + idx + '" title="Choose from material catalog">' + ICONS.search + "<span>" + escapeHtml(chosenLabel(line.materialId)) + "</span></button>" +
          "</div>" +
          '<input class="input" type="number" min="0" step="any" data-field="qtyPerUnit" value="' + line.qtyPerUnit + '" aria-label="Quantity per unit"/>' +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove material line">' + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function costFooterHtml() {
      var complete = state.lines.length && state.lines.every(function (l) { return l.materialId; });
      if (!state.lines.length) return "";
      return '<p class="hint bom-cost-footer" style="margin-top:8px;">' +
        (complete ? "Estimated material cost per unit: <strong style=\"color:var(--text);\">" + escapeHtml(MFG.formatCurrency(estimatedCost())) + "</strong> — auto-fills the Cost price field above." : "Pick a material on every line to see the estimated cost.") +
        "</p>";
    }

    function render() {
      if (!state.lines.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;margin-bottom:10px;">No materials added yet — this item has no Bill of Materials, so Production can\'t make it. Choose at least one material below.</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="bomAddBtn">' + ICONS.packagePlus + " Choose material</button>";
      } else {
        container.innerHTML =
          '<div class="bom-head"><span>Material</span><span>Qty per unit made</span><span></span></div>' +
          state.lines.map(rowHtml).join("") +
          '<button type="button" class="btn btn-secondary btn-sm mt-1" id="bomAddBtn">' + ICONS.packagePlus + " Choose material</button>" +
          costFooterHtml();
      }
      bind();
    }

    function updateFooterInPlace() {
      var footer = container.querySelector(".bom-cost-footer");
      if (footer) footer.outerHTML = costFooterHtml();
    }

    function bind() {
      container.querySelectorAll("[data-idx]").forEach(function (rowEl) {
        var idx = Number(rowEl.getAttribute("data-idx"));
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          input.addEventListener("input", function () {
            var field = input.getAttribute("data-field");
            state.lines[idx][field] = Number(input.value) || 0;
            // The qty input fires on every keystroke, so it only patches
            // the cost footer text in place — a full render() there would
            // rebuild the DOM mid-keystroke and throw focus out of the field.
            updateFooterInPlace();
            if (state.onChange) state.onChange(state.lines);
          });
        });
        var chooseBtn = rowEl.querySelector("[data-choose]");
        if (chooseBtn) {
          chooseBtn.addEventListener("click", function () {
            openCatalogPickerModal({
              title: "Choose a material",
              searchPlaceholder: "Search materials…",
              emptyText: "No active materials yet — add one on the Products page first.",
              entries: catalogEntries(),
              showQty: false,
              closeAfterPick: true,
              onPick: function (mid) {
                state.lines[idx].materialId = mid;
                render();
                if (state.onChange) state.onChange(state.lines);
              },
            });
          });
        }
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) removeBtn.addEventListener("click", function () { state.lines.splice(idx, 1); render(); if (state.onChange) state.onChange(state.lines); });
      });
      var addBtn = container.querySelector("#bomAddBtn");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          openCatalogPickerModal({
            title: "Add materials to this Bill of Materials",
            searchPlaceholder: "Search materials…",
            emptyText: "No active materials yet — add one on the Products page first.",
            entries: catalogEntries(),
            showQty: true,
            qtyLabel: "Qty per unit",
            qtyDefault: 1,
            closeAfterPick: false,
            onPick: function (mid, qty) {
              state.lines.push({ materialId: mid, qtyPerUnit: qty });
              render();
              if (state.onChange) state.onChange(state.lines);
            },
          });
        });
      }
    }

    render();

    return {
      getLines: function () { return state.lines.filter(function (l) { return l.materialId; }); },
      onChange: function (fn) { state.onChange = fn; },
    };
  }

  // ---------- Customer-specific pricing editor (Customers page) ----------
  // A sparse list of {itemId, price} overrides against the finished-goods
  // catalog, edited on a customer's own record. When an override exists
  // for a given customer + item, the invoice line-items editor (above)
  // uses it instead of that item's normal sellPrice the moment the item
  // is picked on a line — see MFG.customerPriceForItem in store.js.
  function createPriceOverridesEditor(container, overrides, sellableItems) {
    var state = {
      lines: (overrides || []).map(function (o) { return Object.assign({}, o); }),
    };
    var items = sellableItems || [];

    function itemOptionsHtml(selectedId) {
      var opts = '<option value="">Choose an item…</option>';
      opts += items.map(function (it) {
        return '<option value="' + it.id + '"' + (selectedId === it.id ? " selected" : "") + ">" + escapeHtml(it.name + " (" + it.sku + ") — normally " + MFG.formatCurrency(it.sellPrice)) + "</option>";
      }).join("");
      return opts;
    }

    function rowHtml(line, idx) {
      return (
        '<div class="bom-row" data-idx="' + idx + '">' +
          '<select class="input" data-field="itemId" aria-label="Item">' + itemOptionsHtml(line.itemId) + "</select>" +
          '<input class="input" type="number" min="0" step="any" data-field="price" value="' + line.price + '" aria-label="Custom price"/>' +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove price override">' + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      if (!items.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;">Add a finished good or buy &amp; sell item on the Products page first, then come back here to give this customer a special price on it.</p>';
        return;
      }
      if (!state.lines.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;margin-bottom:10px;">No custom prices for this customer — every item uses its normal sell price on their invoices.</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="poAddBtn">' + ICONS.plus + " Add a custom price</button>";
      } else {
        container.innerHTML =
          '<div class="bom-head"><span>Item</span><span>Their price</span><span></span></div>' +
          state.lines.map(rowHtml).join("") +
          '<button type="button" class="btn btn-secondary btn-sm mt-1" id="poAddBtn">' + ICONS.plus + " Add a custom price</button>";
      }
      bind();
    }

    function bind() {
      container.querySelectorAll("[data-idx]").forEach(function (rowEl) {
        var idx = Number(rowEl.getAttribute("data-idx"));
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          var evt = input.tagName === "SELECT" ? "change" : "input";
          input.addEventListener(evt, function () {
            var field = input.getAttribute("data-field");
            state.lines[idx][field] = field === "price" ? Number(input.value) || 0 : input.value;
          });
        });
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) removeBtn.addEventListener("click", function () { state.lines.splice(idx, 1); render(); });
      });
      var addBtn = container.querySelector("#poAddBtn");
      if (addBtn) addBtn.addEventListener("click", function () { state.lines.push({ itemId: "", price: 0 }); render(); });
    }

    render();

    return {
      getLines: function () { return state.lines.filter(function (l) { return l.itemId; }); },
    };
  }

  // ---------- Vendor-specific cost pricing editor (Products page) ----------
  // The purchasing mirror of createPriceOverridesEditor above: lives on a
  // purchasable item's own record (a raw material or a buy & sell item —
  // anything bought in) instead of on a customer, and lists {vendorId,
  // price} instead of {itemId, price} — what each vendor actually charges
  // for this one item. The purchase order editor (createPoLineItemsEditor
  // below) uses MFG.vendorPriceForItem to prefill a line's unit cost the
  // moment both a vendor and an item are picked.
  function createVendorPricesEditor(container, vendorPrices, vendors) {
    var state = {
      lines: (vendorPrices || []).map(function (o) { return Object.assign({}, o); }),
    };
    var list = vendors || [];

    function vendorOptionsHtml(selectedId) {
      var opts = '<option value="">Choose a vendor…</option>';
      opts += list.map(function (v) {
        return '<option value="' + v.id + '"' + (selectedId === v.id ? " selected" : "") + ">" + escapeHtml(v.name) + "</option>";
      }).join("");
      return opts;
    }

    function rowHtml(line, idx) {
      return (
        '<div class="bom-row" data-idx="' + idx + '">' +
          '<select class="input" data-field="vendorId" aria-label="Vendor">' + vendorOptionsHtml(line.vendorId) + "</select>" +
          '<input class="input" type="number" min="0" step="any" data-field="price" value="' + line.price + '" aria-label="Vendor price"/>' +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove vendor price">' + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      if (!list.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;">Add a vendor on the Vendors page first, then come back here to set what they charge for this item.</p>';
        return;
      }
      if (!state.lines.length) {
        container.innerHTML = '<p class="text-tertiary" style="font-size:12.5px;margin-bottom:10px;">No vendor-specific prices yet — new purchase orders default to this item\'s normal cost price.</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="vpAddBtn">' + ICONS.plus + " Add a vendor price</button>";
      } else {
        container.innerHTML =
          '<div class="bom-head"><span>Vendor</span><span>Their price</span><span></span></div>' +
          state.lines.map(rowHtml).join("") +
          '<button type="button" class="btn btn-secondary btn-sm mt-1" id="vpAddBtn">' + ICONS.plus + " Add a vendor price</button>";
      }
      bind();
    }

    function bind() {
      container.querySelectorAll("[data-idx]").forEach(function (rowEl) {
        var idx = Number(rowEl.getAttribute("data-idx"));
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          var evt = input.tagName === "SELECT" ? "change" : "input";
          input.addEventListener(evt, function () {
            var field = input.getAttribute("data-field");
            state.lines[idx][field] = field === "price" ? Number(input.value) || 0 : input.value;
          });
        });
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) removeBtn.addEventListener("click", function () { state.lines.splice(idx, 1); render(); });
      });
      var addBtn = container.querySelector("#vpAddBtn");
      if (addBtn) addBtn.addEventListener("click", function () { state.lines.push({ vendorId: "", price: 0 }); render(); });
    }

    render();

    return {
      getLines: function () { return state.lines.filter(function (l) { return l.vendorId; }); },
    };
  }

  // ---------- Purchase order line items editor ----------
  // Structurally the purchasing twin of createLineItemsEditor above, but
  // deliberately kept as its own component rather than a shared one: it
  // picks from purchasable items — raw materials and buy-and-sell items
  // (not finished goods, which are manufactured rather than bought), fills
  // a unit *cost* (not a sell rate) from a vendor-aware callback, and a
  // read-only row also surfaces how much of that line has already been
  // received.
  function createPoLineItemsEditor(container, items, currency, materials, readOnly, getCostForItem) {
    var state = {
      items: (items && items.length ? items : [{ id: MFG.uid(), materialId: null, description: "", quantity: 1, unitCost: 0 }]).map(function (it) {
        return Object.assign({}, it);
      }),
      currency: currency,
      onChange: null,
    };

    var activeMaterials = (materials || []).filter(function (m) { return m.active; });

    function amountText(it) {
      return MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.unitCost || 0)), state.currency);
    }

    function catalogEntries() {
      return activeMaterials.map(function (m) {
        return { id: m.id, name: m.name + " (" + m.sku + ")", meta: MFG.formatCurrency(m.costPrice, state.currency) + "/" + m.unit + " · " + MFG.formatQty(m.stockQty) + " " + m.unit + " in stock" };
      });
    }

    function chosenLabel(it) {
      if (!it.materialId) return "Choose item";
      var m = (materials || []).find(function (x) { return x.id === it.materialId; });
      return m ? m.name : "Item deleted";
    }

    function applyMaterialPick(it, mid) {
      it.materialId = mid;
      var m = (materials || []).find(function (x) { return x.id === mid; });
      if (m) {
        it.description = m.name;
        it.unitCost = (typeof getCostForItem === "function") ? getCostForItem(mid, m.costPrice) : m.costPrice;
      }
    }

    function fieldWrapper(labelText, innerHtml) {
      return '<div class="line-item-field"><span class="line-item-field-label">' + escapeHtml(labelText) + "</span>" + innerHtml + "</div>";
    }

    function qtyReadout(it) {
      var received = Number(it.receivedQty) || 0;
      return MFG.formatQty(it.quantity) + (received > 0 ? '<div class="line-item-stock-hint">' + MFG.formatQty(received) + " received</div>" : "");
    }

    function rowHtml(it) {
      if (readOnly) {
        return (
          '<div class="line-item-row line-item-row-readonly" data-row="' + it.id + '">' +
            fieldWrapper("Description", escapeHtml(it.description || "—")) +
            fieldWrapper("Qty", qtyReadout(it)) +
            fieldWrapper("Unit Cost", MFG.formatCurrency(it.unitCost, state.currency)) +
            '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
            "<div></div>" +
          "</div>"
        );
      }
      return (
        '<div class="line-item-row line-item-row-editable" data-row="' + it.id + '">' +
          fieldWrapper("Item",
            '<div style="display:flex;align-items:center;gap:2px;">' +
              '<button type="button" class="line-item-choose-btn' + (it.materialId ? " has-item" : "") + '" data-choose="' + it.id + '" title="Choose from material catalog">' + ICONS.search + "<span>" + escapeHtml(chosenLabel(it)) + "</span></button>" +
              (it.materialId ? '<button type="button" class="btn-icon neutral" data-clear-item="' + it.id + '" aria-label="Clear item" title="Clear item — make this a custom line">' + ICONS.close + "</button>" : "") +
            "</div>"
          ) +
          fieldWrapper("Description", '<input class="input" data-field="description" value="' + escapeHtml(it.description || "") + '" placeholder="Item or line description" aria-label="Line description"/>') +
          fieldWrapper("Qty", '<input class="input" type="number" min="0" step="any" data-field="quantity" value="' + it.quantity + '" aria-label="Quantity"/>') +
          fieldWrapper("Unit Cost", '<input class="input" type="number" min="0" step="any" data-field="unitCost" value="' + it.unitCost + '" aria-label="Unit cost"/>') +
          '<div class="line-item-amount line-item-field" data-amount><span class="line-item-field-label">Amount</span><span class="line-item-amount-value">' + amountText(it) + "</span></div>" +
          '<button type="button" class="btn-icon" data-remove aria-label="Remove line item"' + (state.items.length === 1 ? " disabled" : "") + ">" + ICONS.trash + "</button>" +
        "</div>"
      );
    }

    function render() {
      var headCols = readOnly
        ? '<div class="line-items-head line-items-head-readonly"><span>Description</span><span>Qty</span><span>Unit Cost</span><span style="text-align:right;">Amount</span><span></span></div>'
        : '<div class="line-items-head line-items-head-editable"><span>Item</span><span>Description</span><span>Qty</span><span>Unit Cost</span><span style="text-align:right;">Amount</span><span></span></div>';
      container.innerHTML =
        '<div class="line-items' + (readOnly ? " line-items-readonly" : "") + '">' +
          headCols +
          state.items.map(rowHtml).join("") +
          (readOnly ? "" :
            '<div class="line-items-footer">' +
              '<button type="button" class="add-line-btn primary" id="chooseCatalogBtn">' + ICONS.packagePlus + " Choose from catalog</button>" +
              '<button type="button" class="add-line-btn" id="addLineBtn">' + ICONS.plus + " Add custom line</button>" +
            "</div>"
          ) +
        "</div>";
      if (!readOnly) bind();
    }

    function bind() {
      container.querySelectorAll("[data-row]").forEach(function (rowEl) {
        var id = rowEl.getAttribute("data-row");
        rowEl.querySelectorAll("[data-field]").forEach(function (input) {
          input.addEventListener("input", function () {
            var field = input.getAttribute("data-field");
            var it = state.items.find(function (x) { return x.id === id; });
            if (!it) return;
            if (field === "description") {
              it.description = input.value;
            } else {
              it[field] = Number(input.value) || 0;
            }
            var amountEl = rowEl.querySelector(".line-item-amount-value");
            if (amountEl) amountEl.textContent = amountText(it);
            if (state.onChange) state.onChange(state.items);
          });
        });
        var chooseBtn = rowEl.querySelector("[data-choose]");
        if (chooseBtn) {
          chooseBtn.addEventListener("click", function () {
            openCatalogPickerModal({
              title: "Choose an item",
              searchPlaceholder: "Search materials…",
              emptyText: "No active materials yet — add one on the Products page, or just type a description below for a custom line.",
              entries: catalogEntries(),
              showQty: false,
              closeAfterPick: true,
              onPick: function (mid) {
                var it = state.items.find(function (x) { return x.id === id; });
                if (!it) return;
                applyMaterialPick(it, mid);
                render();
                if (state.onChange) state.onChange(state.items);
              },
            });
          });
        }
        var clearBtn = rowEl.querySelector("[data-clear-item]");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            var it = state.items.find(function (x) { return x.id === id; });
            if (!it) return;
            it.materialId = null;
            render();
            if (state.onChange) state.onChange(state.items);
          });
        }
        var removeBtn = rowEl.querySelector("[data-remove]");
        if (removeBtn) {
          removeBtn.addEventListener("click", function () {
            if (state.items.length === 1) return;
            state.items = state.items.filter(function (x) { return x.id !== id; });
            render();
            if (state.onChange) state.onChange(state.items);
          });
        }
      });
      var chooseCatalogBtn = container.querySelector("#chooseCatalogBtn");
      if (chooseCatalogBtn) {
        chooseCatalogBtn.addEventListener("click", function () {
          openCatalogPickerModal({
            title: "Add items from catalog",
            searchPlaceholder: "Search materials…",
            emptyText: "No active materials yet — add one on the Products page first.",
            entries: catalogEntries(),
            showQty: true,
            qtyLabel: "Qty",
            qtyDefault: 1,
            closeAfterPick: false,
            onPick: function (mid, qty) {
              var newItem = { id: MFG.uid(), materialId: null, description: "", quantity: qty, unitCost: 0 };
              applyMaterialPick(newItem, mid);
              newItem.quantity = qty;
              if (state.items.length === 1 && !state.items[0].materialId && !state.items[0].description && !state.items[0].unitCost) {
                state.items[0] = newItem;
              } else {
                state.items.push(newItem);
              }
              render();
              if (state.onChange) state.onChange(state.items);
            },
          });
        });
      }
      var addBtn = container.querySelector("#addLineBtn");
      if (addBtn) {
        addBtn.addEventListener("click", function () {
          state.items.push({ id: MFG.uid(), materialId: null, description: "", quantity: 1, unitCost: 0 });
          render();
          if (state.onChange) state.onChange(state.items);
        });
      }
    }

    render();

    return {
      getItems: function () { return state.items; },
      setCurrency: function (c) { state.currency = c; render(); },
      onChange: function (fn) { state.onChange = fn; },
    };
  }

  // ---------- Kanban board renderer (Advanced production mode) ----------
  // `columns` = [{ key, label, cards: [{ id, html }] }]. Pure render —
  // the caller wires up clicks afterward with querySelectorAll, same
  // pattern as every other page in this suite (build HTML, then bind()).
  function kanbanBoardHtml(columns) {
    return (
      '<div class="kanban-board">' +
        columns.map(function (col) {
          return (
            '<div class="kanban-col">' +
              '<div class="kanban-col-head"><span>' + escapeHtml(col.label) + '</span><span class="kanban-count">' + col.cards.length + "</span></div>" +
              '<div class="kanban-col-body">' +
                (col.cards.length ? col.cards.map(function (c) { return '<div class="kanban-card" data-card="' + c.id + '">' + c.html + "</div>"; }).join("") :
                  '<div class="kanban-empty">Nothing here</div>') +
              "</div>" +
            "</div>"
          );
        }).join("") +
      "</div>"
    );
  }

  // ---------- Excel export ----------
  // Built entirely locally by lib/xlsx-writer.js (inlined only into the
  // settings page, which is the only page that needs it) — no CDN, so
  // this works with zero network access instead of failing with
  // "check your internet connection" whenever the SheetJS CDN is
  // unreachable (corporate firewalls, ad blockers, offline use, or —
  // as in this app's own build/test sandbox — no internet at all).
  function downloadWorkbook(sheetName, rows, filename) {
    return downloadWorkbookMulti([{ name: sheetName, rows: rows }], filename);
  }
  function downloadWorkbookMulti(sheets, filename) {
    return global.XLSXWriter.downloadWorkbookMulti(sheets, filename);
  }

  // ---------- printable document window ----------
  // Opens a new tab with a minimal, self-contained print-friendly page and
  // triggers the browser's print dialog — this is how invoices and credit
  // notes become PDFs, with no external library and no server needed
  // ("Save as PDF" is a print destination in every modern browser). Kept
  // strictly black/white/grey to match the app's own monochrome identity.
  var PRINT_CSS =
    "@media print{@page{margin:16mm 14mm;}}" +
    "*{box-sizing:border-box;}" +
    "body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;padding:44px;max-width:800px;margin:0 auto;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact;}" +
    "h1{font-family:Georgia,'Times New Roman',serif;font-size:25px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;}" +
    "h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#555;margin:26px 0 8px;}" +
    ".muted{color:#666;font-size:12px;margin:1px 0;}" +
    ".muted.addr{white-space:pre-line;}" +
    ".letterhead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}" +
    ".company-block .logo{max-height:44px;max-width:220px;margin-bottom:10px;display:block;}" +
    ".doc-block{text-align:right;min-width:180px;}" +
    ".doc-type{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:6px;}" +
    ".doc-meta{font-size:12px;color:#444;margin:2px 0;}" +
    ".doc-meta span{color:#888;display:inline-block;min-width:64px;}" +
    ".doc-number{display:inline-block;font-weight:700;font-size:13px;background:#111;color:#fff;padding:3px 10px;border-radius:3px;letter-spacing:.02em;margin-bottom:6px;}" +
    ".rule{border:none;border-top:2.5px solid #111;margin:20px 0 0;}" +
    ".bill-to{background:#f6f6f6;border-radius:6px;padding:14px 16px;margin-top:22px;}" +
    ".bill-to .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:4px;}" +
    ".bill-to .name{font-weight:700;font-size:14px;}" +
    "table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}" +
    "thead tr{border-bottom:2px solid #111;}" +
    "th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#333;}" +
    "td{padding:10px;border-bottom:1px solid #eee;}" +
    "tbody tr:nth-child(even){background:#fafafa;}" +
    "td.num,th.num{text-align:right;}" +
    ".total-box{margin-top:10px;display:flex;justify-content:flex-end;}" +
    ".total-box .inner{background:#111;color:#fff;padding:12px 20px;border-radius:6px;min-width:220px;display:flex;justify-content:space-between;align-items:center;gap:20px;}" +
    ".total-box .inner .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}" +
    ".total-box .inner .value{font-size:19px;font-weight:700;}" +
    ".doc-footer{margin-top:36px;padding-top:14px;border-top:1px solid #ddd;display:flex;justify-content:space-between;gap:20px;}" +
    ".doc-footer .thanks{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;color:#333;}" +
    ".doc-footer .stamp{font-size:10.5px;color:#999;text-align:right;}" +
    "@media print{body{padding:0;}}";

  function printLetterhead(settings, docType, docNumber, metaLines) {
    return (
      '<div class="letterhead">' +
        '<div class="company-block">' +
          (settings.logoDataUrl ? '<img class="logo" src="' + settings.logoDataUrl + '" />' : "") +
          "<h1>" + escapeHtml(settings.businessName || "Your Business") + "</h1>" +
          (settings.address ? '<p class="muted addr">' + escapeHtml(settings.address) + "</p>" : "") +
          [settings.email, settings.phone, settings.website].filter(Boolean).map(function (v) { return '<p class="muted">' + escapeHtml(v) + "</p>"; }).join("") +
        "</div>" +
        '<div class="doc-block">' +
          '<div class="doc-type">' + escapeHtml(docType) + "</div>" +
          (docNumber ? '<div class="doc-number">' + escapeHtml(docNumber) + "</div>" : "") +
          metaLines.map(function (m) { return '<p class="doc-meta"><span>' + escapeHtml(m.label) + "</span>" + escapeHtml(m.value) + "</p>"; }).join("") +
        "</div>" +
      "</div>" +
      '<hr class="rule"/>'
    );
  }

  function openPrintWindow(title, bodyHtml) {
    var win = window.open("", "_blank");
    if (!win) { toast("Your browser blocked the print window pop-up — allow pop-ups for this site and try again.", "error"); return; }
    win.document.write(
      "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>" + escapeHtml(title) + "</title>" +
      "<style>" + PRINT_CSS + "</style></head><body>" + bodyHtml +
      // Split across concatenated string pieces on purpose (this whole
      // file gets inlined into a real <script> element by the build
      // step, and the literal closing-tag text appearing anywhere in
      // this file's raw source would truncate everything after it).
      "<" + "script>window.onload=function(){setTimeout(function(){window.print();},150);};" + "<" + "/script>" +
      "</body></html>"
    );
    win.document.close();
  }

  // Builds and opens a printable invoice document, including any credit
  // applied — used both from the invoice editor and the invoices list.
  function printInvoice(invoice, customer, settings, payments, creditNotes) {
    var totals = MFG.computeTotals(invoice);
    var paid = MFG.amountPaid(invoice.id, payments || []);
    var creditApplied = MFG.creditAppliedForInvoice(invoice.id, creditNotes || []);
    var balance = MFG.round2(totals.total - paid - creditApplied);
    var rowsHtml = (invoice.items || []).map(function (it) {
      return "<tr><td>" + escapeHtml(it.description || "—") + "</td>" +
        "<td class='num'>" + it.quantity + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(it.rate, invoice.currency) + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.rate || 0)), invoice.currency) + "</td></tr>";
    }).join("");
    var metaLines = [
      { label: "Issued", value: MFG.formatDate(invoice.issueDate) },
      { label: "Due", value: MFG.formatDate(invoice.dueDate) },
    ];
    var billLines = customer ? [customer.name, customer.company, customer.email, customer.address].filter(Boolean) : ["—"];
    var settledLine = creditApplied > 0
      ? '<div class="total-box"><div class="inner" style="background:#666;"><span class="label">Credit Applied</span><span class="value">-' + MFG.formatCurrency(creditApplied, invoice.currency) + "</span></div></div>"
      : "";
    var html =
      printLetterhead(settings, "INVOICE", invoice.number, metaLines) +
      '<div class="bill-to">' +
        '<div class="label">Bill To</div>' +
        billLines.map(function (l, i) { return '<div class="' + (i === 0 ? "name" : "muted") + '">' + escapeHtml(l) + "</div>"; }).join("") +
      "</div>" +
      "<table><thead><tr><th>Description</th><th class='num'>Qty</th><th class='num'>Rate</th><th class='num'>Amount</th></tr></thead><tbody>" +
      rowsHtml +
      "</tbody></table>" +
      settledLine +
      '<div class="total-box"><div class="inner">' +
        '<span class="label">' + ((paid > 0 || creditApplied > 0) ? "Balance Due" : "Total") + "</span>" +
        '<span class="value">' + MFG.formatCurrency((paid > 0 || creditApplied > 0) ? balance : totals.total, invoice.currency) + "</span>" +
      "</div></div>" +
      (invoice.notes ? '<h2>Notes</h2><p class="muted">' + escapeHtml(invoice.notes) + "</p>" : "") +
      (settings.paymentInstructions ? '<h2>Payment Instructions</h2><p class="muted">' + escapeHtml(settings.paymentInstructions) + "</p>" : "") +
      '<div class="doc-footer"><div class="thanks">Thank you for your business.</div><div class="stamp">Generated ' + MFG.formatDate(MFG.todayISO()) + "</div></div>";
    openPrintWindow("Invoice " + invoice.number, html);
  }

  // Prints a standalone credit-note document — its own applications (if
  // any) are listed so it's clear at a glance where the credit has gone.
  function printCreditNote(creditNote, customer, settings) {
    var applied = (creditNote.applications || []).reduce(function (sum, a) { return sum + a.amount; }, 0);
    var remaining = MFG.round2(creditNote.amount - applied);
    var metaLines = [{ label: "Issued", value: MFG.formatDate(creditNote.date) }, { label: "Reason", value: creditNote.reason || "—" }];
    var billLines = customer ? [customer.name, customer.company, customer.email, customer.address].filter(Boolean) : ["—"];
    var appliedRows = (creditNote.applications || []).map(function (a) {
      return "<tr><td>" + escapeHtml(MFG.formatDate(a.date)) + "</td><td class='num'>" + MFG.formatCurrency(a.amount) + "</td></tr>";
    }).join("");
    var html =
      printLetterhead(settings, "CREDIT NOTE", "CN-" + creditNote.id.slice(0, 8).toUpperCase(), metaLines) +
      '<div class="bill-to">' +
        '<div class="label">Issued To</div>' +
        billLines.map(function (l, i) { return '<div class="' + (i === 0 ? "name" : "muted") + '">' + escapeHtml(l) + "</div>"; }).join("") +
      "</div>" +
      (creditNote.note ? '<h2>Note</h2><p class="muted">' + escapeHtml(creditNote.note) + "</p>" : "") +
      (appliedRows ? "<h2>Applied To</h2><table><thead><tr><th>Date</th><th class='num'>Amount</th></tr></thead><tbody>" + appliedRows + "</tbody></table>" : "") +
      '<div class="total-box"><div class="inner">' +
        '<span class="label">Remaining Credit</span><span class="value">' + MFG.formatCurrency(remaining) + "</span>" +
      "</div></div>" +
      '<div class="doc-footer"><div class="thanks">Thank you for your business.</div><div class="stamp">Generated ' + MFG.formatDate(MFG.todayISO()) + "</div></div>";
    openPrintWindow("Credit Note", html);
  }

  // Builds and opens a printable purchase order — addressed to the vendor,
  // listing what's being bought. Reuses the same letterhead (our business
  // details) as invoices and credit notes; the "Vendor" block below it is
  // the purchasing equivalent of an invoice's "Bill To" block.
  function printPurchaseOrder(po, vendor, settings) {
    var total = MFG.computePoTotal(po);
    var rowsHtml = (po.items || []).map(function (it) {
      return "<tr><td>" + escapeHtml(it.description || "—") + "</td>" +
        "<td class='num'>" + it.quantity + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(it.unitCost, po.currency) + "</td>" +
        "<td class='num'>" + MFG.formatCurrency(MFG.round2((it.quantity || 0) * (it.unitCost || 0)), po.currency) + "</td></tr>";
    }).join("");
    var metaLines = [
      { label: "Issued", value: MFG.formatDate(po.issueDate) },
      { label: "Expected", value: po.expectedDate ? MFG.formatDate(po.expectedDate) : "—" },
    ];
    var vendorLines = vendor ? [vendor.name, vendor.company, vendor.email, vendor.address].filter(Boolean) : ["—"];
    var html =
      printLetterhead(settings, "PURCHASE ORDER", po.number, metaLines) +
      '<div class="bill-to">' +
        '<div class="label">Vendor</div>' +
        vendorLines.map(function (l, i) { return '<div class="' + (i === 0 ? "name" : "muted") + '">' + escapeHtml(l) + "</div>"; }).join("") +
      "</div>" +
      "<table><thead><tr><th>Description</th><th class='num'>Qty</th><th class='num'>Unit Cost</th><th class='num'>Amount</th></tr></thead><tbody>" +
      rowsHtml +
      "</tbody></table>" +
      '<div class="total-box"><div class="inner">' +
        '<span class="label">Total</span><span class="value">' + MFG.formatCurrency(total, po.currency) + "</span>" +
      "</div></div>" +
      (po.notes ? '<h2>Notes</h2><p class="muted">' + escapeHtml(po.notes) + "</p>" : "") +
      '<div class="doc-footer"><div class="thanks">Thank you.</div><div class="stamp">Generated ' + MFG.formatDate(MFG.todayISO()) + "</div></div>";
    openPrintWindow("Purchase Order " + po.number, html);
  }

  global.MFGUI = {
    ICONS: ICONS,
    applyAccent: applyAccent,
    renderShell: renderShell,
    showStorageBanner: showStorageBanner,
    hideStorageBanner: hideStorageBanner,
    toast: toast,
    openModal: openModal,
    confirmDialog: confirmDialog,
    escapeHtml: escapeHtml,
    emptyState: emptyState,
    statusBadge: statusBadge,
    productionStatusBadge: productionStatusBadge,
    openCatalogPickerModal: openCatalogPickerModal,
    createLineItemsEditor: createLineItemsEditor,
    createBomEditor: createBomEditor,
    createPriceOverridesEditor: createPriceOverridesEditor,
    createVendorPricesEditor: createVendorPricesEditor,
    createPoLineItemsEditor: createPoLineItemsEditor,
    purchaseOrderStatusBadge: purchaseOrderStatusBadge,
    paymentStatusBadge: paymentStatusBadge,
    openVendorPaymentModal: openVendorPaymentModal,
    kanbanBoardHtml: kanbanBoardHtml,
    colorVarStyle: colorVarStyle,
    colorVarDecls: colorVarDecls,
    el: el,
    qs: qs,
    BUILD_DATE: BUILD_DATE,
    downloadWorkbook: downloadWorkbook,
    downloadWorkbookMulti: downloadWorkbookMulti,
    openPrintWindow: openPrintWindow,
    printLetterhead: printLetterhead,
    printInvoice: printInvoice,
    printCreditNote: printCreditNote,
    printPurchaseOrder: printPurchaseOrder,
  };
})(window);

</script>
<script>
/* Purchase order editor page — create or edit (?id=<purchaseOrderId>)
   ---------------------------------------------------------
   Mirrors the invoice editor's draft-locks-on-send discipline, but the
   stock-touching step is different: sending a purchase order never moves
   stock by itself (nothing has arrived yet) — only Receive Items does,
   and it can be used more than once as a shipment shows up in parts,
   walking the order from sent -> partial -> received. See
   MFG.receivePurchaseOrder in store.js for the one place that happens. */
(function () {
  "use strict";

  var shell = MFGUI.renderShell("purchase-orders");

  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var data = MFG.getData();
  var existing = id ? data.purchaseOrders.find(function (p) { return p.id === id; }) : undefined;

  if (id && !existing) {
    shell.setTitle("Purchase order not found", "");
    shell.contentEl.innerHTML =
      '<div class="empty" style="padding-top:64px;">' +
        '<div class="icon-wrap">' + MFGUI.ICONS.purchaseOrders + "</div>" +
        "<h3>This purchase order could not be found</h3><p>It may have been deleted.</p>" +
        '<div class="mt-2"><a class="btn btn-secondary btn-sm" href="purchase-orders.html">Back to Purchase Orders</a></div>' +
      "</div>";
    return;
  }

  var CURRENCIES = MFG.CURRENCY_CODES.slice().sort();
  var prefillMaterialId = !existing ? params.get("material") : null;
  var prefillVendorId = !existing ? params.get("vendorId") : null;

  function rawStatus() { return existing ? existing.status : "draft"; }
  function isDraft() { return rawStatus() === "draft"; }

  function defaultLine() {
    if (prefillMaterialId) {
      var m = MFG.findItem(prefillMaterialId);
      if (m) {
        var qty = Math.max(1, MFG.round2((m.reorderThreshold || 0) * 2 - m.stockQty));
        return { id: MFG.uid(), materialId: m.id, description: m.name, quantity: qty, unitCost: m.costPrice };
      }
    }
    return { id: MFG.uid(), materialId: null, description: "", quantity: 1, unitCost: 0 };
  }

  var state = existing
    ? {
        vendorId: existing.vendorId,
        issueDate: existing.issueDate,
        expectedDate: existing.expectedDate || "",
        paymentDueDate: existing.paymentDueDate || "",
        items: existing.items && existing.items.length ? existing.items : [{ id: MFG.uid(), materialId: null, description: "", quantity: 1, unitCost: 0 }],
        currency: existing.currency,
        notes: existing.notes || "",
      }
    : {
        vendorId: prefillVendorId || (data.vendors.length === 1 ? data.vendors[0].id : ""),
        issueDate: MFG.todayISO(),
        expectedDate: "",
        paymentDueDate: "",
        items: [defaultLine()],
        currency: data.settings.currency,
        notes: "",
      };

  var lineItemsEditor = null;

  function vendorOptionsHtml() {
    if (data.vendors.length === 0) return "";
    return '<option value="">Select a vendor…</option>' + data.vendors.map(function (v) {
      return '<option value="' + v.id + '"' + (state.vendorId === v.id ? " selected" : "") + ">" + MFGUI.escapeHtml(v.name) + (v.company ? " — " + MFGUI.escapeHtml(v.company) : "") + "</option>";
    }).join("");
  }

  function vendor() {
    return data.vendors.find(function (v) { return v.id === state.vendorId; });
  }

  function currentTotal() {
    return MFG.computePoTotal(state);
  }

  function renderHeaderActions() {
    if (!existing) return "";
    var raw = rawStatus();
    var progress = MFG.poReceivingProgress(existing);
    var html = "";
    if (raw === "sent" || raw === "partial") {
      html += '<button class="btn btn-secondary btn-sm" id="receiveBtn">' + MFGUI.ICONS.packagePlus + " Receive Items</button>";
    }
    html += '<button class="btn btn-secondary btn-sm" id="duplicateBtn">' + MFGUI.ICONS.copy + " Duplicate</button>";
    if (raw === "sent" || raw === "partial") html += '<button class="btn btn-secondary btn-sm" id="cancelBtn">' + MFGUI.ICONS.ban + " Cancel</button>";
    if (progress.totalReceived <= 0) html += '<button class="btn btn-danger btn-sm" id="deleteBtn">' + MFGUI.ICONS.trash + " Delete</button>";
    return html;
  }

  function render() {
    var draft = isDraft();
    var raw = rawStatus();
    shell.setActions("");
    shell.contentEl.innerHTML =
      '<div class="max-width-editor">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">' +
          '<a href="purchase-orders.html" style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);text-decoration:none;font-size:13px;">&larr; Purchase Orders</a>' +
          (existing ? MFGUI.purchaseOrderStatusBadge(raw) : "") +
        "</div>" +
        '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;">' +
          "<h1 style=\"font-size:20px;font-weight:650;\">" + (existing ? "Purchase Order " + MFGUI.escapeHtml(existing.number) : "New Purchase Order") + "</h1>" +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;" id="headerActions">' + renderHeaderActions() + "</div>" +
        "</div>" +

        (draft ? "" :
          '<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--surface-2,var(--surface));">' +
            MFGUI.ICONS.alert +
            '<p class="text-secondary" style="font-size:12.5px;margin:0;">' +
              (raw === "cancelled"
                ? "This purchase order is cancelled and read-only. Duplicate it into a fresh draft to reorder."
                : "This purchase order has been sent, so the details below are read-only. Use Receive Items as stock arrives, or Cancel to close it out.") +
            "</p>" +
          "</div>"
        ) +

        '<div class="card section-card">' +
          '<div class="form-grid">' +
            '<div class="field"><label>Vendor<span class="req">*</span></label>' +
            (data.vendors.length === 0
              ? '<p class="text-tertiary" style="font-size:13px;border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px;">No vendors yet. <a href="vendors.html" style="color:var(--text);">Add one first</a>.</p>'
              : '<select class="input" id="fVendor"' + (draft ? "" : " disabled") + '>' + vendorOptionsHtml() + "</select>") +
            '<span class="error hidden" id="fVendorErr">Select a vendor.</span></div>' +
            '<div class="field"><label>Currency</label><select class="input" id="fCurrency"' + (draft ? "" : " disabled") + '>' +
              CURRENCIES.map(function (c) { return '<option value="' + c + '"' + (state.currency === c ? " selected" : "") + ">" + c + " (" + MFGUI.escapeHtml(MFG.currencySymbol(c)) + ")</option>"; }).join("") +
            "</select></div>" +
            '<div class="field"><label>Issue date</label><input class="input" type="date" id="fIssue" value="' + state.issueDate + '"' + (draft ? "" : " disabled") + "/></div>" +
            '<div class="field"><label>Expected date</label><input class="input" type="date" id="fExpected" value="' + (state.expectedDate || "") + '"' + (draft ? "" : " disabled") + "/></div>" +
            '<div class="field"><label>Payment due date</label><input class="input" type="date" id="fPayDue" value="' + (state.paymentDueDate || "") + '"' + (draft ? "" : " disabled") + "/>" +
            '<span class="hint">Optional — when this vendor expects payment. Shows up as overdue in Accounts Payable if it passes unpaid.</span></div>' +
          "</div>" +
        "</div>" +

        '<div class="card section-card">' +
          "<h2>Line Items</h2>" +
          (draft ? '<p class="text-secondary" style="font-size:12px;margin-top:-8px;margin-bottom:12px;">Pick a raw material or buy-and-sell item to auto-fill its description and cost — that cost uses this vendor\'s own price on it if you\'ve set one (from its Edit form on Products), otherwise its normal cost price. Leave it as a custom line for a one-off charge like shipping.</p>' : "") +
          '<span class="error hidden" id="fItemsErr" style="display:block;margin-bottom:10px;">Add at least one line item.</span>' +
          '<div id="lineItemsContainer"></div>' +
        "</div>" +

        '<div class="card section-card">' +
          '<div style="display:flex;justify-content:flex-end;">' +
            '<div class="summary-list" style="min-width:220px;">' +
              '<div class="summary-row total"><span>Total</span><span>' + MFG.formatCurrency(currentTotal(), state.currency) + "</span></div>" +
            "</div>" +
          "</div>" +
        "</div>" +

        '<div class="card section-card">' +
          '<div class="field"><label>Notes</label><textarea class="input" id="fNotes" rows="3" placeholder="Delivery instructions, PO terms, etc."' + (draft ? "" : " disabled") + '>' + MFGUI.escapeHtml(state.notes) + "</textarea>" +
          '<span class="hint">Shown on the printed purchase order.</span></div>' +
        "</div>" +

        paymentsCardHtml() +
        attachmentsCardHtml() +

        '<div class="editor-actionbar">' +
          '<button class="btn btn-secondary btn-sm" id="printBtn">' + MFGUI.ICONS.print + " Print / Save as PDF</button>" +
          (draft
            ? '<button class="btn btn-secondary btn-sm" id="saveDraftBtn">' + MFGUI.ICONS.pencil + " Save Draft</button>" +
              '<button class="btn btn-primary btn-sm" id="saveSendBtn">' + MFGUI.ICONS.mail + " Save &amp; Send</button>"
            : "") +
        "</div>" +
      "</div>";

    lineItemsEditor = MFGUI.createPoLineItemsEditor(
      document.getElementById("lineItemsContainer"),
      state.items,
      state.currency,
      MFG.purchasableItems(),
      !draft,
      function (materialId, defaultCost) {
        if (!state.vendorId) return defaultCost;
        var override = MFG.vendorPriceForItem(state.vendorId, materialId);
        return override == null ? defaultCost : override;
      }
    );
    if (draft) {
      lineItemsEditor.onChange(function (items) {
        state.items = items;
        refreshTotal();
      });
    }

    bind();
  }

  function refreshTotal() {
    var el = document.querySelector('.summary-row.total span:last-child');
    if (el) el.textContent = MFG.formatCurrency(currentTotal(), state.currency);
  }

  function readFormIntoState() {
    if (!isDraft()) return;
    if (data.vendors.length > 0) state.vendorId = document.getElementById("fVendor").value;
    state.currency = document.getElementById("fCurrency").value;
    state.issueDate = document.getElementById("fIssue").value;
    state.expectedDate = document.getElementById("fExpected").value || undefined;
    state.paymentDueDate = document.getElementById("fPayDue").value || undefined;
    state.notes = document.getElementById("fNotes").value.trim();
    state.items = lineItemsEditor.getItems();
  }

  // ---------- payments to vendor ----------
  // Money owed on this order, independent of MFGUI.purchaseOrderStatusBadge
  // above (which tracks physical receiving progress) — a deposit can be
  // paid before anything ships, so payment is only ever gated on the order
  // having been sent at all, never on how much of it has arrived.
  function paymentsCardHtml() {
    if (!existing) return "";
    var raw = rawStatus();
    if (raw === "draft") return "";
    var pays = (data.vendorPayments || [])
      .filter(function (p) { return p.purchaseOrderId === existing.id; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var total = MFG.computePoTotal(existing);
    var paid = MFG.poAmountPaid(existing.id);
    var balance = MFG.round2(total - paid);
    var payEligible = raw === "sent" || raw === "partial" || raw === "received";
    return (
      '<div class="card section-card">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">' +
          "<h2 style=\"margin:0;\">Payments to Vendor</h2>" +
          (payEligible && balance > 0 ? '<button type="button" class="btn btn-secondary btn-sm" id="recordPayBtn">' + MFGUI.ICONS.wallet + " Record Payment</button>" : "") +
        "</div>" +
        '<div class="summary-list" style="margin-bottom:' + (pays.length ? "14px" : "0") + ';">' +
          '<div class="summary-row"><span>Total</span><span>' + MFG.formatCurrency(total, existing.currency) + "</span></div>" +
          '<div class="summary-row success"><span>Paid</span><span>' + MFG.formatCurrency(paid, existing.currency) + "</span></div>" +
          '<div class="summary-row balance"><span>Balance due</span><span>' + MFG.formatCurrency(balance, existing.currency) + "</span></div>" +
        "</div>" +
        (pays.length === 0 ? "" :
          '<div class="divider-list">' + pays.map(function (p) {
            return (
              '<div class="row">' +
                '<div class="min-w-0"><p class="title">' + MFG.formatCurrency(p.amount, existing.currency) + "</p>" +
                '<p class="meta">' + MFG.formatDate(p.date) + " · " + MFGUI.escapeHtml(p.method) + (p.note ? " · " + MFGUI.escapeHtml(p.note) : "") + "</p></div>" +
                '<button type="button" class="btn-icon" data-remove-pay="' + p.id + '" aria-label="Delete payment record">' + MFGUI.ICONS.trash + "</button>" +
              "</div>"
            );
          }).join("") + "</div>"
        ) +
      "</div>"
    );
  }

  // ---------- attachments (delivery notes, the vendor's own invoice) ----------
  function attachmentKindLabel(kind) {
    return kind === "delivery_note" ? "Delivery Note" : kind === "vendor_invoice" ? "Vendor Invoice" : "Other";
  }
  function formatFileSize(bytes) {
    if (!bytes) return "0 KB";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }
  function attachmentRowHtml(a) {
    var isImage = (a.mimeType || "").indexOf("image/") === 0;
    return (
      '<div class="attachment-row">' +
        '<div class="attachment-thumb">' + (isImage ? '<img src="' + a.dataUrl + '" alt=""/>' : MFGUI.ICONS.fileText) + "</div>" +
        '<div class="min-w-0" style="flex:1;">' +
          '<p class="title truncate" style="font-size:13px;">' + MFGUI.escapeHtml(a.name) + "</p>" +
          '<p class="meta">' + attachmentKindLabel(a.kind) + " · " + formatFileSize(a.size) + " · " + MFG.formatDate((a.uploadedAt || "").slice(0, 10)) + "</p>" +
        "</div>" +
        '<div style="display:flex;gap:4px;flex-shrink:0;">' +
          '<a class="btn-icon neutral" href="' + a.dataUrl + '" target="_blank" rel="noopener" aria-label="View ' + MFGUI.escapeHtml(a.name) + '">' + MFGUI.ICONS.download + "</a>" +
          '<button type="button" class="btn-icon" data-remove-att="' + a.id + '" aria-label="Remove ' + MFGUI.escapeHtml(a.name) + '">' + MFGUI.ICONS.trash + "</button>" +
        "</div>" +
      "</div>"
    );
  }
  function attachmentsCardHtml() {
    if (!existing) return "";
    var atts = existing.attachments || [];
    return (
      '<div class="card section-card">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:' + (atts.length ? "14px" : "8px") + ';">' +
          "<h2 style=\"margin:0;\">Attachments</h2>" +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
            '<select class="input" id="attKind" style="width:auto;padding:7px 10px;font-size:12.5px;" aria-label="Attachment type">' +
              '<option value="vendor_invoice">Vendor Invoice</option>' +
              '<option value="delivery_note">Delivery Note</option>' +
              '<option value="other">Other</option>' +
            "</select>" +
            '<input type="file" accept="image/*,application/pdf" id="attInput" class="hidden"/>' +
            '<button type="button" class="btn btn-secondary btn-sm" id="attAddBtn"' + (atts.length >= MFG.ATTACHMENT_MAX_COUNT ? " disabled" : "") + '>' + MFGUI.ICONS.paperclip + " Attach File</button>" +
          "</div>" +
        "</div>" +
        (atts.length === 0
          ? '<p class="text-tertiary" style="font-size:12.5px;">No files attached yet. Attach a delivery note, the vendor\'s invoice, or anything else worth keeping with this order — stored right in the app, up to ' + Math.round(MFG.ATTACHMENT_MAX_BYTES / 1024 / 1024 * 10) / 10 + 'MB per file, ' + MFG.ATTACHMENT_MAX_COUNT + ' per order.</p>'
          : '<div class="attachment-list">' + atts.map(attachmentRowHtml).join("") + "</div>"
        ) +
      "</div>"
    );
  }

  function validate() {
    var ok = true;
    document.getElementById("fItemsErr").classList.add("hidden");
    var vendorErr = document.getElementById("fVendorErr");
    if (vendorErr) vendorErr.classList.add("hidden");
    if (!state.vendorId) {
      if (vendorErr) vendorErr.classList.remove("hidden");
      ok = false;
    }
    var hasDescription = state.items.some(function (it) { return (it.description || "").trim(); });
    if (!hasDescription) {
      document.getElementById("fItemsErr").classList.remove("hidden");
      ok = false;
    }
    return ok;
  }

  function buildPayload() {
    return {
      vendorId: state.vendorId,
      issueDate: state.issueDate,
      expectedDate: state.expectedDate || undefined,
      paymentDueDate: state.paymentDueDate || undefined,
      items: state.items,
      currency: state.currency,
      notes: state.notes || undefined,
    };
  }

  // Deliberately explicit, same reasoning as the invoice editor's
  // offerPostSendActions: no auto-navigating mailto, and an honest note
  // that a browser can't attach the PDF to the email for you.
  function offerPostSendActions(po) {
    var v = vendor();
    var body =
      '<p class="text-secondary" style="font-size:13px;">Purchase order ' + MFGUI.escapeHtml(po.number) + " was sent." + "</p>" +
      '<p class="text-tertiary" style="font-size:12px;">Browsers can\'t attach a file to an email automatically — download the PDF first, then attach it yourself in the email that opens.</p>';
    MFGUI.openModal({
      title: "Purchase Order Sent",
      body: body,
      footer:
        '<button class="btn btn-secondary btn-sm" id="psPdfBtn">' + MFGUI.ICONS.print + " Download PDF</button>" +
        (v && v.email ? '<button class="btn btn-secondary btn-sm" id="psEmailBtn">' + MFGUI.ICONS.mail + " Email " + MFGUI.escapeHtml(v.name) + "</button>" : "") +
        '<button class="btn btn-primary btn-sm" id="psDoneBtn">Done</button>',
      onMount: function (root, close) {
        root.querySelector("#psDoneBtn").addEventListener("click", close);
        root.querySelector("#psPdfBtn").addEventListener("click", function () {
          MFGUI.printPurchaseOrder(po, v, data.settings);
        });
        var emailBtn = root.querySelector("#psEmailBtn");
        if (emailBtn) {
          emailBtn.addEventListener("click", function () {
            var total = MFG.computePoTotal(po);
            var subject = encodeURIComponent("Purchase Order " + po.number + " from " + data.settings.businessName);
            var mailBody = encodeURIComponent(
              "Hi " + v.name + ",\n\nPlease find purchase order " + po.number + " for " + MFG.formatCurrency(total, po.currency) +
              (po.expectedDate ? ", expected " + po.expectedDate : "") + ".\n\n(Attach the PDF you just downloaded before sending.)\n\nThank you!\n" + data.settings.businessName
            );
            window.open("mailto:" + v.email + "?subject=" + subject + "&body=" + mailBody, "_blank");
          });
        }
      },
    });
  }

  function openReceiveModal() {
    var lines = (existing.items || []).filter(function (l) { return l.materialId; });
    if (!lines.length) { MFGUI.toast("This purchase order has no material lines to receive.", "info"); return; }
    var body =
      '<p class="text-secondary" style="font-size:12.5px;margin-bottom:12px;">Enter how much of each material actually arrived. Defaults to the full remaining quantity — adjust for a partial shipment.</p>' +
      '<div class="flex-col" style="gap:12px;">' +
      lines.map(function (l) {
        var m = MFG.findItem(l.materialId);
        var already = l.receivedQty || 0;
        var remaining = MFG.round2(Math.max(0, (Number(l.quantity) || 0) - already));
        return (
          '<div class="field" data-recv-line="' + l.id + '">' +
            '<label>' + MFGUI.escapeHtml(l.description || (m ? m.name : "Deleted item")) + "</label>" +
            '<p class="text-tertiary" style="font-size:11.5px;margin-bottom:4px;">Ordered ' + MFG.formatQty(l.quantity) + (m ? " " + MFGUI.escapeHtml(m.unit) : "") + " · Already received " + MFG.formatQty(already) + " · Remaining " + MFG.formatQty(remaining) + "</p>" +
            '<input class="input" type="number" min="0" max="' + remaining + '" step="any" data-recv-qty value="' + remaining + '"' + (remaining <= 0 ? " disabled" : "") + "/>" +
          "</div>"
        );
      }).join("") +
      "</div>";

    MFGUI.openModal({
      title: "Receive Items — " + existing.number,
      body: body,
      wide: true,
      footer: '<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Record Receipt</button>',
      onMount: function (root, close) {
        root.querySelector("#cancelBtn").addEventListener("click", close);
        root.querySelector("#saveBtn").addEventListener("click", function () {
          var receipts = [];
          root.querySelectorAll("[data-recv-line]").forEach(function (rowEl) {
            var lineId = rowEl.getAttribute("data-recv-line");
            var input = rowEl.querySelector("[data-recv-qty]");
            var qty = input ? Number(input.value) || 0 : 0;
            if (qty > 0) receipts.push({ lineId: lineId, qty: qty });
          });
          if (!receipts.length) { MFGUI.toast("Enter at least one received quantity.", "error"); return; }
          var res = MFG.receivePurchaseOrder(existing.id, receipts);
          if (!res.ok) { MFGUI.toast(res.error, "error"); return; }
          MFGUI.toast("Stock updated.");
          close();
          data = MFG.getData();
          existing = data.purchaseOrders.find(function (p) { return p.id === id; });
          render();
        });
      },
    });
  }

  function bind() {
    ["fCurrency", "fIssue", "fExpected", "fPayDue"].forEach(function (fieldId) {
      var el = document.getElementById(fieldId);
      if (!el) return;
      el.addEventListener("input", readFormIntoState);
      el.addEventListener("change", function () {
        readFormIntoState();
        if (fieldId === "fCurrency") lineItemsEditor.setCurrency(state.currency);
        refreshTotal();
      });
    });
    var vendorSel = document.getElementById("fVendor");
    if (vendorSel) {
      vendorSel.addEventListener("change", function () {
        readFormIntoState();
      });
    }
    var notesEl = document.getElementById("fNotes");
    if (notesEl) notesEl.addEventListener("input", readFormIntoState);

    document.getElementById("printBtn").addEventListener("click", function () {
      readFormIntoState();
      if (!validate()) return;
      var po = existing
        ? Object.assign({}, existing, isDraft() ? buildPayload() : {})
        : Object.assign({ id: "preview", number: MFG.nextPoNumber(), status: "draft", createdAt: MFG.nowISO(), updatedAt: MFG.nowISO() }, buildPayload());
      MFGUI.printPurchaseOrder(po, vendor(), data.settings);
    });

    var saveDraftBtn = document.getElementById("saveDraftBtn");
    if (saveDraftBtn) {
      saveDraftBtn.addEventListener("click", function () {
